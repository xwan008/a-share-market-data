name: One-shot schema32 simple valuation fixed migration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-schema32-simple-valuation-fix.yml']
permissions:
  contents: write
jobs:
  migrate:
    if: github.event.head_commit.message == 'run schema32 simple valuation fixed migration'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply schema32 fixed contract
        run: python .github/patch_schema32_simple_valuation_fix.py
      - name: Install
        run: python -m pip install -r requirements.txt pytest
      - name: Validate
        env: {PYTHONPATH: '${{ github.workspace }}'}
        run: pytest -q
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/patch_schema32_simple_valuation.py .github/patch_schema32_simple_valuation_fix.py .github/workflows/one-shot-schema32-simple-valuation.yml .github/workflows/one-shot-schema32-simple-valuation-fix.yml
          git commit -m "research: simplify default valuation engine"
          git push
# final rerun after explicit no-candidate-pool wording
