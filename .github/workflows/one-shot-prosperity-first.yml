name: Refactor low-risk flow to prosperity-first discovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-prosperity-first.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'refactor low-risk flow to prosperity-first discovery'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Patch contracts, skill, docs and tests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          # ---- Manifest schema29 ----
          mp=Path('config/research_pipeline_manifest.json')
          m=json.loads(mp.read_text(encoding='utf-8'))
          m['schema_version']=29
          m['stage_order']=[
              'data_health','taxonomy_coverage','market_prosperity_discovery',
              'level3_profitability_verification','profit_chain_decomposition',
              'chain_company_light_screen','chain_company_comparison_and_dedup',
              'valuation','price_structure','buy_point_synthesis','completion_gate'
          ]

          c=m['scan_cadence_contract']
          c.pop('full_scan_expected_level3_nodes',None)
          c.pop('level1_level2_may_be_derived_from_level3_children',None)
          c['full_scan_unit']='level1_level2_prosperity_discovery'
          c['weekly_full_market_discovery_expected_counts']={'level1':31,'level2':134}
          c['weekly_full_market_discovery_reviews_all_level1_level2']=True
          c['full_346_level3_profitability_review_required']=False
          c['selected_prosperity_directions_expand_all_descendant_level3']=True
          c['selected_prosperity_directions_may_not_be_top_n_capped']=True
          c['level3_verification_scope']='全部被景气发现层选中的一级/二级方向所覆盖的三级行业；未选中三级仅做taxonomy routing，不要求当期盈利深研'
          c['full_scan_is_market_state_baseline_not_candidate_pool']=True
          c['daily_incremental_between_full_scans']=True
          c['daily_incremental_discovery_scope']='31个一级+134个二级全部检查新增景气触发；新进入景气方向时立即展开其全部三级行业验证'
          c['daily_carry_forward_allowed_only_from_valid_weekly_baseline']=True
          c['previous_companies_chains_or_opportunities_may_not_seed_discovery']=True
          c['bootstrap_rule']='没有当前schema有效景气基线时，下一次可执行研究必须先完成31一级+134二级全市场景气发现，并完成所有被选中方向的三级盈利验证'
          c['friday_full_scan_rule']='每周五18:00重做31一级+134二级全市场景气发现，并重验所有被选中方向的三级行业；其他工作日18:00做全市场景气触发增量与必要的新增三级下钻'
          c['successful_bootstrap_next_full_scan']='bootstrap可立即生成有效基线；最近一个Friday 18:00仍按正式锚点重做全市场景气发现'

          m['market_prosperity_discovery_contract']={
              'purpose':'先回答最近哪些大行业/二级行业的盈利景气正在改善，再决定三级研究范围；禁止直接从公司或旧机会名单反推行业。',
              'scope':{'level1':31,'level2':134},
              'all_level1_level2_must_be_reviewed_each_weekly_full':True,
              'daily_incremental_checks_all_level1_level2_triggers':True,
              'required_fields':['code','name','level','parent_code','trend','strength','breadth','confidence','leading_variables','evidence_basis','recent_change_window','selected_for_level3_verification','selection_reason'],
              'allowed_trend':['improving','stable','deteriorating','unconfirmed'],
              'allowed_strength':['strong','normal','weak','unknown'],
              'allowed_breadth':['broad','selective','divergent','unknown'],
              'allowed_confidence':['high','medium','low'],
              'preferred_evidence':['行业利润/利润率','产品价格或价差','库存','开工率/产能利用率','订单/出货/销量/产量','进出口/供需','代表性公司经营数据','政策对真实供需或成本的影响'],
              'market_price_or_sector_return_cannot_be_primary_evidence':True,
              'selection_rule':'二级行业trend=improving，或breadth=selective/divergent需要向三级拆分时，进入三级验证；若一级行业improving/selective/divergent但二级证据不足以定位，则该一级行业下全部三级行业进入验证，防止遗漏。',
              'top_n_or_fixed_count_selection_forbidden':True,
              'previous_period_focus_list_cannot_replace_current_full_discovery':True
          }

          m['level3_profitability_verification_contract']={
              'purpose':'只在景气发现后的相关三级行业中验证真实盈利状态，并决定是否形成可进入公司层的盈利链。',
              'selected_level2_expands_all_child_level3':True,
              'selected_level1_without_resolved_level2_expands_all_descendant_level3':True,
              'every_expanded_level3_requires_real_evidence_review':True,
              'expanded_level3_generic_unconfirmed_placeholder_forbidden':True,
              'unselected_level3_not_required_for_weekly_profitability_review':True,
              'unselected_level3_must_record_routing_reason':'parent_not_selected_by_current_prosperity_discovery',
              'required_verified_fields':['code','name','parent_code','trend','strength','breadth','confidence','evidence_basis','leading_variables','profit_driver','needs_profit_chain_research','profit_chain_resolution'],
              'profit_chain_trigger_rule':'三级行业trend=improving时必须进入盈利链拆解；deteriorating或明显divergent可进入诊断拆解，但不得直接进入机会公司筛选。',
              'company_layer_entry_requires':'verified level3 trend=improving + resolved profit chain + confirmed profit transmission'
          }

          cov=m['coverage_contract']
          led=cov['ledger_contract']
          led.pop('instantiate_all_taxonomy_nodes_before_profitability_scan',None)
          led['instantiate_all_taxonomy_nodes_before_market_prosperity_discovery']=True
          led['taxonomy_coverage_and_profitability_verification_are_separate']=True
          led['accounted_for_definition']='所有31/134/346节点必须在taxonomy ledger中有唯一routing记录；accounted_for表示已被发现层路由，不等于该三级节点已做当期盈利深研。被景气层选中的三级节点才必须有真实盈利证据。'
          led.pop('weekly_level3_each_node_requires_real_evidence_review',None)
          led.pop('weekly_level3_generic_unconfirmed_placeholder_forbidden',None)
          led['selected_level3_each_node_requires_real_evidence_review']=True
          led['selected_level3_generic_unconfirmed_placeholder_forbidden']=True
          led['unselected_level3_may_be_taxonomy_only']=True
          if 'not_selected' not in led['allowed_scan_depth']:
              led['allowed_scan_depth'].append('not_selected')
          if 'not_selected_by_prosperity_discovery' not in led['allowed_evidence_scope']:
              led['allowed_evidence_scope'].append('not_selected_by_prosperity_discovery')
          led['deep_trigger_rule']='仅对已进入三级盈利验证的节点应用：trend=improving/deteriorating，或breadth=selective/divergent时deep；未被景气发现层选中的三级节点scan_depth=not_selected。'
          cov.pop('profitability_discovery_gate',None)
          cov['prosperity_and_level3_gate']={
              'weekly_full_requires_all_31_level1_reviewed':True,
              'weekly_full_requires_all_134_level2_reviewed':True,
              'selected_direction_count_may_be_zero_but_must_not_be_top_n_capped':True,
              'every_selected_direction_must_expand_all_required_level3':True,
              'every_expanded_level3_must_be_evidence_reviewed':True,
              'unselected_level3_need_only_complete_taxonomy_routing':True,
              'daily_incremental_requires_valid_baseline_not_older_than_days':7,
              'daily_incremental_requires_trigger_check_for_all_level1_level2':True
          }

          p=m['profit_chain_resolution_contract']
          p['required_for_each_deep_coverage_node']=False
          p['required_for_each_verified_level3_trigger_node']=True
          p['confirmed_improving_chain_definition']='由本期已完成三级盈利验证且trend=improving的三级节点拆出，resolution_status=resolved、Driver与利润传导已确认的盈利链'

          rs=m['research_state_contract']['required_top_level_sections']
          for sec in ['market_prosperity_discovery','level3_profitability_verification']:
              if sec not in rs:
                  rs.insert(rs.index('profit_chains') if 'profit_chains' in rs else 1, sec)

          g=m['completion_gate_contract']
          g['all_level1_level2_prosperity_discovery_complete']=True
          g['no_prosperity_discovery_top_n_truncation']=True
          g['all_selected_directions_fully_expanded_to_level3']=True
          g['all_expanded_level3_profitability_verified']=True

          po=m['public_output']
          secs=po['sections']
          if '全市场景气发现' not in secs:
              idx=1 if len(secs)>1 else len(secs)
              secs.insert(idx,'全市场景气发现')
          po['prosperity_discovery_must_show_all_selected_directions']=True
          po['level3_verification_must_be_grouped_under_selected_prosperity_directions']=True
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # ---- Runtime policy schema9 ----
          rp=Path('config/research_runtime_policy.json')
          r=json.loads(rp.read_text(encoding='utf-8'))
          r['schema_version']=9
          c=r['state_compatibility']
          c['valid_industry_baseline_conditions']=[
              'manifest schema matches current schema',
              'taxonomy coverage contains exact 31/134/346 nodes',
              'all 31 level1 and 134 level2 prosperity discovery rows are complete',
              'every selected prosperity direction has fully expanded and verified required level3 descendants',
              'prosperity and level3 gate passed',
              'weekly baseline age is within manifest freshness limit',
              'baseline data cutoff and latest completed trade date are explicit'
          ]
          d=r['discovery_policy']
          d['weekly_industry_baseline_may_carry_forward_between_full_scans']=True
          d['previous_state_may_seed_only_industry_baseline_for_daily_incremental']=True
          d['current_full_market_level1_level2_discovery_cannot_be_replaced_by_previous_focus_list']=True
          d['prosperity_selection_top_n_forbidden']=True
          d['selected_direction_level3_expansion_cap_forbidden']=True

          s=r['stage_execution_policy']
          s.pop('coverage_ledger_must_be_instantiated_before_profitability_scan',None)
          s.pop('weekly_full_scan_must_review_all_level3_nodes',None)
          s.pop('generic_weekly_unconfirmed_placeholders_forbidden',None)
          s['coverage_ledger_must_be_instantiated_before_market_prosperity_discovery']=True
          s['weekly_full_scan_must_review_all_level1_level2_for_prosperity']=True
          s['weekly_full_scan_does_not_require_all_346_level3_profitability_reviews']=True
          s['prosperity_discovery_must_precede_level3_profitability_verification']=True
          s['prosperity_discovery_top_n_forbidden']=True
          s['selected_level2_must_expand_all_child_level3']=True
          s['selected_unresolved_level1_must_expand_all_descendant_level3']=True
          s['every_expanded_level3_must_be_profitability_verified']=True
          s['unselected_level3_may_remain_taxonomy_only']=True
          s['daily_incremental_requires_all_level1_level2_trigger_checks']=True
          r['write_policy']['new_state_must_include_market_prosperity_discovery_and_level3_verification']=True
          rp.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # ---- Orchestrator ----
          op=Path('skills/a-share-low-risk/orchestrator/SKILL.md')
          old=op.read_text(encoding='utf-8')
          marker='## 5. 全链公司轻筛'
          tail=old[old.index(marker):]
          head='''# A股低风险研究 V2 编排 Skill

## 目标
执行唯一主链：
`数据健康 → 全市场景气发现（31一级+134二级） → 景气方向完整展开 → 相关三级行业盈利验证 → 盈利链递归拆解 → 链内全部公司轻筛 → survivor横向比较 → 跨链去重 → 逐公司完整估值 → 价格结构 → 买点交集 → Completion Gate`

核心原则：**先发现最近哪里正在变好，再验证这些方向下面哪些三级盈利链真的改善，最后才找公司。**

本Skill不建立周度机会池、候选池、T2池或跨期公司名单。跨期只允许保留“全市场景气发现 + 已验证三级盈利状态”的市场基线，不能保留公司发现种子。

## 1. DATA HEALTH
确认主板范围、最近完整交易日、最新行情、历史数据和全市场价格结构新鲜。机械数据陈旧时fail closed。

## 2. 第一层：全市场景气发现
每次weekly_full先轻量扫描申万2021全部31个一级行业和134个二级行业，回答：**最近哪些行业的真实经营景气正在改善？**

这里不先看公司，也不从上期机会名单、熟悉板块或当日涨幅反推行业。优先证据包括：行业利润/利润率、产品价格或价差、库存、开工率/产能利用率、订单/出货/销量/产量、进出口/供需、代表性公司经营数据，以及真正改变供需或成本的政策。

行业指数涨幅、ETF强弱和市场情绪可以做辅助验证，但不能作为“景气改善”的第一证据。

所有31+134都必须被检查；**禁止Top-N或固定数量截断。** 化工、煤炭、有色、电力设备等只要本期证据达到规则，就全部进入下一层，不得因为已有3个方向就停止。

对每个一级/二级行业记录：`trend / strength / breadth / confidence / leading_variables / evidence_basis / recent_change_window / selected_for_level3_verification / selection_reason`。

## 3. 第二层：景气方向向三级完整下钻
景气发现层不是最终结论，只决定“哪里值得做昂贵的三级盈利验证”。

下钻规则：
- 二级行业 `trend=improving`：该二级行业下**全部三级行业**进入盈利验证；
- 二级行业 `breadth=selective/divergent`：必须向三级拆开验证，不能因为二级整体不整齐而放弃；
- 若一级行业已明显 `improving/selective/divergent`，但二级证据不足以定位具体方向，则该一级行业下**全部三级行业**进入验证，防止遗漏；
- 任何入选方向不得只挑“最强3个三级行业”。

未被景气发现层选中的三级节点仍要在taxonomy ledger中有routing记录，但不要求本期逐一做完整盈利研究；这和“遗漏”不同，因为它们已经被上层景气扫描明确路由为“本期不下钻”。

## 4. 第三层：三级盈利验证与盈利链拆解
对所有被展开的三级行业逐一研究真实盈利状态，形成：`trend / strength / breadth / confidence / evidence_basis / leading_variables / profit_driver`。

这里才回答：**大行业最近变好之后，究竟是下面哪些三级产业链真的在赚钱/利润改善？**

- 三级 `trend=improving`：必须进入盈利链递归拆解，确认Driver、领先变量、利润传导、Forward Bridge和失效条件；
- `deteriorating` 或明显 `divergent`：可做诊断拆解，但不能直接进入机会公司筛选；
- 只有 `verified level3 improving + resolved profit chain + confirmed profit transmission` 才允许进入公司层。

例如“基础化工景气改善”只表示值得下钻；真正进入公司层的可以是农药、氟化工、磷化工、轮胎材料等其中已被证据确认利润改善的三级链。煤炭同理，先确认煤炭大方向，再区分动力煤、焦煤等具体盈利链。

日度增量时仍检查全部31一级+134二级的新触发。若出现新的景气方向，当天就展开对应全部三级行业；已有基线方向无新增触发可carry forward。上一期公司、估值和机会名单不得作为本期发现起点。

'''
          op.write_text(head+tail,encoding='utf-8')

          # ---- README ----
          readme=Path('data/research/v2/README.md')
          readme.write_text('''# Low-risk research runtime data\n\nThis directory contains only current-runtime artifacts:\n- `full_market_price_structure.json`: mechanical full-market timing snapshot.\n- `research_state.json`: the only persisted Prompt research result; it may be absent when no valid current-schema run exists.\n\nThe current research baseline is prosperity-first: first scan all 31 level-1 and 134 level-2 SW industries for recent real-economy profitability/prosperity changes, then fully expand only the selected prosperity directions into their level-3 industries for evidence-based profitability verification. Unselected level-3 nodes remain taxonomically routed but are not required to receive a full profitability review each run.\n\nThe retained baseline is market-state memory only. It is not a weekly opportunity list, candidate pool, company pool, ranking, or preselected answer set. Previous companies, valuations and opportunities may not seed a new discovery run.\n\nPublic fundamental/industry evidence is researched at run time. No independent weekly pool, candidate cache, T2 cache or duplicated valuation output may be persisted. `research_state.manifest_schema` must equal the current Manifest schema.\n''',encoding='utf-8')

          # ---- Tests ----
          tp=Path('tests/test_research_contract.py')
          t=tp.read_text(encoding='utf-8')
          t=t.replace('def test_manifest_schema28_and_stage_order():','def test_manifest_schema29_and_stage_order():')
          t=t.replace("assert m['schema_version'] == 28","assert m['schema_version'] == 29")
          old_stage="""assert m['stage_order'] == [\n        'data_health', 'taxonomy_coverage', 'profitability_scan',\n        'profit_chain_decomposition', 'chain_company_light_screen',\n        'chain_company_comparison_and_dedup', 'valuation', 'price_structure',\n        'buy_point_synthesis', 'completion_gate'\n    ]"""
          new_stage="""assert m['stage_order'] == [\n        'data_health', 'taxonomy_coverage', 'market_prosperity_discovery',\n        'level3_profitability_verification', 'profit_chain_decomposition',\n        'chain_company_light_screen', 'chain_company_comparison_and_dedup',\n        'valuation', 'price_structure', 'buy_point_synthesis', 'completion_gate'\n    ]"""
          t=t.replace(old_stage,new_stage)
          start=t.index('def test_scan_cadence_is_weekly_full_plus_daily_incremental_not_weekly_pool():')
          end=t.index('\n\ndef test_coverage_uses_four_dimensions',start)
          cadence='''def test_scan_cadence_is_prosperity_first_then_selected_level3_verification():\n    c = manifest()['scan_cadence_contract']\n    assert c['full_scan_unit'] == 'level1_level2_prosperity_discovery'\n    assert c['weekly_full_market_discovery_expected_counts'] == {'level1': 31, 'level2': 134}\n    assert c['weekly_full_market_discovery_reviews_all_level1_level2'] is True\n    assert c['full_346_level3_profitability_review_required'] is False\n    assert c['selected_prosperity_directions_expand_all_descendant_level3'] is True\n    assert c['selected_prosperity_directions_may_not_be_top_n_capped'] is True\n    assert c['daily_incremental_between_full_scans'] is True\n    assert c['previous_companies_chains_or_opportunities_may_not_seed_discovery'] is True\n'''
          t=t[:start]+cadence+t[end:]
          start=t.index('def test_coverage_uses_four_dimensions')
          end=t.index('\n\ndef test_profit_chain_research_admission_cannot_use_top_n',start)
          coverage='''def test_prosperity_discovery_and_level3_verification_are_separate():\n    m = manifest()\n    d = m['market_prosperity_discovery_contract']\n    v = m['level3_profitability_verification_contract']\n    c = m['coverage_contract']['ledger_contract']\n    assert d['scope'] == {'level1': 31, 'level2': 134}\n    assert d['all_level1_level2_must_be_reviewed_each_weekly_full'] is True\n    assert d['market_price_or_sector_return_cannot_be_primary_evidence'] is True\n    assert d['top_n_or_fixed_count_selection_forbidden'] is True\n    assert v['selected_level2_expands_all_child_level3'] is True\n    assert v['selected_level1_without_resolved_level2_expands_all_descendant_level3'] is True\n    assert v['every_expanded_level3_requires_real_evidence_review'] is True\n    assert v['unselected_level3_not_required_for_weekly_profitability_review'] is True\n    assert c['taxonomy_coverage_and_profitability_verification_are_separate'] is True\n    assert c['selected_level3_each_node_requires_real_evidence_review'] is True\n    assert c['unselected_level3_may_be_taxonomy_only'] is True\n'''
          t=t[:start]+coverage+t[end:]
          gate_anchor="    assert g['near_miss_ranking_complete_when_eligible_universe_nonempty'] is True\n"
          gate_add="    assert g['all_level1_level2_prosperity_discovery_complete'] is True\n    assert g['no_prosperity_discovery_top_n_truncation'] is True\n    assert g['all_selected_directions_fully_expanded_to_level3'] is True\n    assert g['all_expanded_level3_profitability_verified'] is True\n"
          if gate_add not in t:
              t=t.replace(gate_anchor,gate_anchor+gate_add)
          tp.write_text(t,encoding='utf-8')

          rt=Path('tests/test_research_runtime_policy.py')
          x=rt.read_text(encoding='utf-8')
          x=x.replace('Schema28 CI checkpoint','Schema29 CI checkpoint')
          x=x.replace("assert p['schema_version'] == 8","assert p['schema_version'] == 9")
          old="""    assert s['weekly_full_scan_must_review_all_level3_nodes'] is True\n    assert s['daily_incremental_requires_valid_weekly_baseline'] is True\n    assert s['generic_weekly_unconfirmed_placeholders_forbidden'] is True\n"""
          new="""    assert s['weekly_full_scan_must_review_all_level1_level2_for_prosperity'] is True\n    assert s['weekly_full_scan_does_not_require_all_346_level3_profitability_reviews'] is True\n    assert s['prosperity_discovery_must_precede_level3_profitability_verification'] is True\n    assert s['prosperity_discovery_top_n_forbidden'] is True\n    assert s['selected_level2_must_expand_all_child_level3'] is True\n    assert s['selected_unresolved_level1_must_expand_all_descendant_level3'] is True\n    assert s['every_expanded_level3_must_be_profitability_verified'] is True\n    assert s['daily_incremental_requires_valid_weekly_baseline'] is True\n    assert s['daily_incremental_requires_all_level1_level2_trigger_checks'] is True\n"""
          x=x.replace(old,new)
          rt.write_text(x,encoding='utf-8')

          st=Path('tests/test_research_state_coverage_ledger.py')
          y=st.read_text(encoding='utf-8')
          y=y.replace('test_persisted_state_schema28_contract_when_present','test_persisted_state_schema29_contract_when_present')
          y=y.replace("assert state['manifest_schema'] == manifest['schema_version'] == 28","assert state['manifest_schema'] == manifest['schema_version'] == 29")
          st.write_text(y,encoding='utf-8')

          # Old state was generated under the reversed schema28 semantics; do not relabel it.
          state=Path('data/research/v2/research_state.json')
          if state.exists():
              state.unlink()
          PY
      - run: python -m pip install -r requirements.txt pytest
      - name: Validate contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q
      - name: Commit and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/workflows/one-shot-prosperity-first.yml
          git commit -m "research: make prosperity discovery precede level3 verification"
          git push
