name: Prosperity-first research migration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-prosperity-first.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply migration
        run: python .github/patch_prosperity_first.py
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Validate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q
      - name: Commit migration and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/workflows/one-shot-prosperity-first.yml .github/patch_prosperity_first.py
          git commit -m "research: make prosperity discovery precede level3 verification"
          git push
