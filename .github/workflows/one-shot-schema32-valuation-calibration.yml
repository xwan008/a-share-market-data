name: One-shot schema32 valuation calibration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-schema32-valuation-calibration.yml']
permissions:
  contents: write
jobs:
  calibrate:
    if: github.event.head_commit.message == 'run schema32 valuation calibration'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - name: Calibrate four representative companies
        run: python scripts/one_shot_schema32_valuation_calibration.py
      - name: Cleanup
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one_shot_schema32_valuation_calibration.py .github/workflows/one-shot-schema32-valuation-calibration.yml
          git commit -m "ci: remove schema32 valuation calibration"
          git push
