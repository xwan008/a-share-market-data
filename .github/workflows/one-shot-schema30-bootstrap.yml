name: One-shot schema30 bootstrap
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-schema30-bootstrap.yml']
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.event.head_commit.message == 'run schema30 bootstrap'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        run: python -m pip install -r requirements.txt pytest
      - name: Execute schema30 bootstrap
        env: {PYTHONPATH: '${{ github.workspace }}'}
        run: python scripts/one_shot_schema30_bootstrap.py
      - name: Validate
        env: {PYTHONPATH: '${{ github.workspace }}'}
        run: pytest -q
      - name: Commit state and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/v2/research_state.json
          git rm scripts/one_shot_schema30_bootstrap.py .github/workflows/one-shot-schema30-bootstrap.yml
          git commit -m "research: bootstrap schema30 prosperity-first state"
          git push
