name: One-shot schema31 valuation v2 fixed migration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-schema31-valuation-v2-fix.yml']
permissions:
  contents: write
jobs:
  migrate:
    if: github.event.head_commit.message == 'run schema31 valuation v2 fixed migration'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply fixed migration
        run: python .github/patch_schema31_valuation_v2_fix.py
      - name: Install
        run: python -m pip install -r requirements.txt pytest
      - name: Validate
        env: {PYTHONPATH: '${{ github.workspace }}'}
        run: pytest -q
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/patch_schema31_valuation_v2.py .github/patch_schema31_valuation_v2_fix.py .github/workflows/one-shot-schema31-valuation-v2.yml .github/workflows/one-shot-schema31-valuation-v2-fix.yml
          git commit -m "research: introduce valuation engine v2"
          git push
