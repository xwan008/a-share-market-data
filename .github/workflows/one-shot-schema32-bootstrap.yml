name: One-shot schema32 bootstrap
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-schema32-bootstrap.yml']
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.event.head_commit.message == 'run schema32 bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        run: python -m pip install -r requirements.txt pytest
      - name: Execute schema32 bootstrap
        env: {PYTHONPATH: '${{ github.workspace }}'}
        run: python scripts/one_shot_schema32_bootstrap.py
      - name: Contract tests
        env: {PYTHONPATH: '${{ github.workspace }}'}
        run: pytest -q
      - name: Validate research state
        run: |
          python - <<'PY'
          import json
          p='data/research/v2/research_state.json'
          s=json.load(open(p,encoding='utf-8'))
          assert s['manifest_schema']==32
          assert s['status']=='research_complete'
          assert s['diagnostics']['completion_gate_passed'] is True
          v=s['diagnostics']['valuation']
          b=s['diagnostics']['buy_point']
          assert v['executed_count']==v['valuation_set_count']
          if v['complete_non_review_count']:
              assert b['near_miss_output_count']>0
          print(json.dumps({'schema':s['manifest_schema'],'data_cutoff':s['data_cutoff'],'directions':s['diagnostics']['prosperity_search']['selected_direction_count'],'mapped_l3':s['diagnostics']['prosperity_search']['mapped_level3_count'],'improving_l3':s['diagnostics']['prosperity_search']['improving_level3_count'],'screened':s['diagnostics']['company_screen']['light_screen_universe_company_count'],'valuation_set':v['valuation_set_count'],'review':v['review_required_count'],'buyable_now':b['buyable_now_count'],'near_miss':s['near_miss_ranking']},ensure_ascii=False,indent=2))
          PY
      - name: Commit state and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/v2/research_state.json
          git rm scripts/one_shot_schema32_bootstrap.py .github/workflows/one-shot-schema32-bootstrap.yml
          git commit -m "research: execute schema32 bootstrap"
          git pull --rebase origin main
          git push
