name: Refresh low-risk mechanical inputs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_v2_full_market_price_structure.py'
      - '.github/workflows/refresh-low-risk-mechanical-inputs.yml'
  schedule:
    - cron: '50 16 * * 1-5'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: a-share-low-risk-mechanical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh to latest main
        if: github.ref_name == 'main'
        shell: bash
        run: |
          git fetch origin main
          git merge --ff-only origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install research dependencies
        run: pip install -r requirements-research.txt
      - name: Refresh independent full-market price structure
        run: python scripts/build_v2_full_market_price_structure.py
      - name: Validate mechanical input
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/research/v2/full_market_price_structure.json')
          if not path.exists():
              raise SystemExit(f'missing mechanical input: {path}')
          data=json.loads(path.read_text(encoding='utf-8'))
          if not isinstance(data, dict) or not data:
              raise SystemExit(f'invalid mechanical input: {path}')
          print(path, data.get('reference_trade_date') or data.get('trade_date') or 'date-unreported')
          PY
      - name: Commit mechanical input
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/v2/full_market_price_structure.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research-v2: refresh price structure"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
