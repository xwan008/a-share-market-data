name: Inspect weekly financial sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect_weekly_financial_sources.py'
      - '.github/workflows/inspect-weekly-sources.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements-research.txt
      - run: python scripts/inspect_weekly_financial_sources.py
      - shell: bash
        run: |
          if git status --porcelain -- data/research/pipeline/weekly_source_debug.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/research/pipeline/weekly_source_debug.json
            git commit -m "debug: capture weekly financial source schema"
            git pull --rebase origin main
            git push
          fi
