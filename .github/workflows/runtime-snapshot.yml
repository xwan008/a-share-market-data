name: Publish ChatGPT runtime snapshot

# Event-driven bridge: upstream production workflows dispatch this explicitly after
# they commit a new authoritative main revision. It no longer runs on every push.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: a-share-runtime-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build locked-commit manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          health = json.loads(Path('data/health.json').read_text(encoding='utf-8'))
          commodity = health.get('commodity_anchors') or {}
          payload = {
              'schema_version': 2,
              'repo': 'xwan008/a-share-market-data',
              'commit_sha': sha,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'snapshot_kind': 'chatgpt_runtime_locked_commit',
              'trade_date': health.get('trade_date'),
              'commodity_anchor_status': commodity.get('status'),
              'commodity_reference_trade_date': commodity.get('reference_trade_date'),
          }
          Path('runtime_snapshot_manifest.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          print(json.dumps(payload, ensure_ascii=False))
          PY

      - name: Upload locked-commit runtime snapshot
        uses: actions/upload-artifact@v4
        with:
          name: a-share-runtime-snapshot
          path: |
            runtime_snapshot_manifest.json
            config/research_runtime_policy.json
            config/research_pipeline_manifest.json
            config/industry_scan_universe.json
            data/health.json
            data/commodity/futures_daily.json
            data/research/industry_state.json
            data/research/full_market_price_structure.json
            data/shards/*.json
            data/history_shards/*.json
            skills/a-share-low-risk/orchestrator/SKILL.md
            skills/a-share-low-risk/company-research/SKILL.md
            skills/a-share-low-risk/valuation/SKILL.md
            skills/a-share-low-risk/price-structure/SKILL.md
            scripts/validate_research_completion.py
          if-no-files-found: error
          retention-days: 3

      - name: Dispatch downstream industry evidence refresh
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/dispatch_workflow_and_wait.sh update-industry-evidence.yml main
