name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'skills/a-share-low-risk/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'requirements.txt'
      - 'requirements-research.txt'
  pull_request:
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'skills/a-share-low-risk/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'requirements.txt'
      - 'requirements-research.txt'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: python -m pytest -q
