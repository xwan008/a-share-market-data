name: Build forward valuation scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_forward_valuation.py'
      - '.github/workflows/build-forward-valuation.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements-research.txt
      - name: Build forward valuation
        run: python scripts/build_forward_valuation.py
      - name: Validate valuation hard contract
        run: python scripts/validate_research_outputs.py fundamental-valuation data/research/pipeline/left_valuation_scan.json
      - name: Commit valuation scan
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/pipeline/left_valuation_scan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: freeze forward valuation scan"
          git pull --rebase origin main
          git push
