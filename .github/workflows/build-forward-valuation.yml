name: Build forward valuation scan

on:
  workflow_dispatch:
  push:
    branches: [main, fix/valuation-v4]
    paths:
      - 'scripts/build_forward_valuation.py'
      - 'scripts/build_cycle_valuation.py'
      - 'scripts/merge_left_valuation.py'
      - 'scripts/validate_research_outputs.py'
      - 'config/valuation_policy_registry.json'
      - 'config/cycle_valuation_policy.json'
      - 'skills/a-share-low-risk/fundamental-valuation/SKILL.md'
      - 'skills/a-share-low-risk/cycle-valuation/SKILL.md'
      - 'tests/test_valuation_v4.py'
      - '.github/workflows/build-forward-valuation.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements-research.txt pytest
      - name: Run valuation regression tests
        run: pytest -q tests/test_valuation_v4.py
      - name: Build non-cycle forward valuation
        run: python scripts/build_forward_valuation.py
      - name: Validate non-cycle valuation contract
        run: python scripts/validate_research_outputs.py fundamental-valuation data/research/pipeline/fundamental_valuation.json
      - name: Build resource and cycle valuation
        run: python scripts/build_cycle_valuation.py
      - name: Validate cycle valuation contract
        run: python scripts/validate_research_outputs.py cycle-valuation data/research/pipeline/cycle_valuation.json
      - name: Merge left valuation engines
        run: python scripts/merge_left_valuation.py
      - name: Validate full left coverage
        run: python scripts/validate_research_outputs.py left-valuation data/research/pipeline/left_valuation_scan.json
      - name: Print focus valuation diagnostics
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/research/pipeline/left_valuation_scan.json',encoding='utf-8'))
          focus={'000338','002475','000807','601600','601899'}
          rows=[r for r in p['companies'] if r['code'] in focus]
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - name: Commit valuation scans
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/pipeline/fundamental_valuation.json data/research/pipeline/cycle_valuation.json data/research/pipeline/left_valuation_scan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: freeze forward and cycle valuation scans"
          git pull --rebase origin main
          git push
