name: One-shot schema27 major restructuring audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-schema27-major-restructure-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply manifest valuation exception and rebuild opportunities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/research/v2/research_state.json')
          s=json.loads(p.read_text(encoding='utf-8'))
          code='603268'
          v=s['valuations'][code]
          v['review_required']=True
          v['review_exception_code']='major_restructuring'
          v['model_execution_status']='blocked_after_full_attempt'
          v['earnings_type']='review_required'
          v['reasonable_price_range']=None
          v['safe_price_range']=None
          v['valuation_position']='review_required'
          v['uncertainty']='high'
          v['blocker_evidence']=(
              '公司2025年完成重大资产重组：置出原日用陶瓷资产并置入恒力重工100%股权，主营业务由陶瓷制造切换为船舶及高端装备；'
              '2026半年报亦明确该重组及同一控制下合并/追溯调整。跨重组期2025A EPS与2026H1利润季节性不可直接机械外推，故按Manifest major_restructuring异常出口停止给出合理价/安全价。'
          )
          v['reasonable_price_assumption']='重大资产重组导致历史盈利口径不可比；此前Forward PE机械外推结果作废，需建立重组后独立盈利历史后再估值。'
          v['falsifiers']=['待重组后形成足够可比季度/年度盈利历史后重新建立Forward Bridge']

          for comp in s.get('chain_comparisons',[]):
              eligible=[]
              for c in comp.get('compared_companies',[]):
                  vv=s['valuations'].get(c) or {}; ps=s['price_structures'].get(c) or {}
                  if vv.get('review_required'): continue
                  if vv.get('valuation_position') in {'safe_zone','below_fair'} and ps.get('structure_type') in {'pullback','trend_continuation','breakout'} and ps.get('chase_risk')!='high' and ps.get('action') not in {'avoid','wait_pullback','unavailable'}:
                      eligible.append(c)
              comp['current_opportunity_best']=eligible[0] if eligible else None
              comp['opportunity_resolution_complete']=any(not (s['valuations'].get(c) or {}).get('review_required',False) for c in comp.get('compared_companies',[]))

          new_ops=[]
          for comp in s.get('chain_comparisons',[]):
              c=comp.get('current_opportunity_best')
              if not c: continue
              vv=s['valuations'][c]; ps=s['price_structures'][c]; co=s['companies'][c]
              new_ops.append({
                  'code':c,'name':co['name'],'chain_id':comp['chain_id'],'industry':co['sw_level3_name'],
                  'current_price':vv['current_price'],'reasonable_price_range':vv['reasonable_price_range'],'safe_price_range':vv['safe_price_range'],
                  'valuation_position':vv['valuation_position'],'price_structure':ps['structure_type'],'timing_action':ps['action'],
                  'action':'low_risk_candidate' if vv['valuation_position']=='safe_zone' else 'watch_below_fair'
              })
          s['current_opportunities']=new_ops
          vd=s['diagnostics']['valuation']
          vd['valuation_set_count']=len(s['valuation_set'])
          vd['executed_count']=len(s['valuation_set'])
          vd['review_required_count']=sum(bool(x.get('review_required')) for x in s['valuations'].values())
          vd['complete_non_review_count']=len(s['valuation_set'])-vd['review_required_count']
          vd['valuation_gate_passed']=all(x.get('valuation_attempt_complete') for x in s['valuations'].values())
          s.setdefault('diagnostics',{})['manual_exception_audit']={
              '603268':'major_restructuring exception applied; prior mechanical fair/safe ranges invalidated',
              'current_opportunities_recomputed':True
          }
          p.write_text(json.dumps(s,ensure_ascii=False,indent=2),encoding='utf-8')
          watch=[]
          for c in s['valuation_set']:
              vv=s['valuations'][c]; ps=s['price_structures'][c]; co=s['companies'][c]
              if not vv.get('review_required') and vv.get('valuation_position') in {'safe_zone','below_fair'}:
                  watch.append({'code':c,'name':co['name'],'industry':co['sw_level3_name'],'price':vv['current_price'],
                                'fair':vv['reasonable_price_range'],'safe':vv['safe_price_range'],'valuation':vv['valuation_position'],
                                'structure':ps.get('structure_type'),'timing':ps.get('action'),'chase':ps.get('chase_risk')})
          print(json.dumps({'current_opportunities':new_ops,'valuation_watch':watch,'review_required':[c for c,vv in s['valuations'].items() if vv.get('review_required')]},ensure_ascii=False,indent=2))
          PY
      - name: Validate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pip install -r requirements.txt pytest
          pytest -q
      - name: Commit and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-schema27-major-restructure-audit.yml
          git add data/research/v2/research_state.json
          git commit -m "research: apply major restructuring valuation exception"
          git push
