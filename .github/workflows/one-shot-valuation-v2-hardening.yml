name: One-shot valuation v2 hardening
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-valuation-v2-hardening.yml']
permissions:
  contents: write
jobs:
  harden:
    if: github.event.head_commit.message == 'run valuation v2 hardening'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python .github/patch_schema31_valuation_v2_hardening.py
      - run: python -m pip install -r requirements.txt pytest
      - env: {PYTHONPATH: '${{ github.workspace }}'}
        run: pytest -q
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/patch_schema31_valuation_v2_hardening.py .github/workflows/one-shot-valuation-v2-hardening.yml
          git commit -m "research: harden valuation v2 gates"
          git push
