name: Schema30 lean discovery cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-schema30-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message == 'cleanup schema30 lean discovery leftovers'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cleanup contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          mp=Path('config/research_pipeline_manifest.json')
          m=json.loads(mp.read_text(encoding='utf-8'))
          c=m['scan_cadence_contract']
          c.pop('selected_prosperity_directions_expand_all_descendant_level3',None)
          p=m['persistence_contract']
          p['0600_requires_valid_previous_1800_state']=False
          p['0600_requires_valid_current_schema_market_baseline']=True
          secs=m['public_output']['sections']
          seen=[]
          m['public_output']['sections']=[x for x in secs if not (x in seen or seen.append(x))]
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          t=Path('tests/test_research_contract.py')
          s=t.read_text(encoding='utf-8')
          marker="    assert c['selected_prosperity_directions_may_not_be_top_n_capped'] is True\n"
          s=s.replace(marker, marker+"    assert 'selected_prosperity_directions_expand_all_descendant_level3' not in c\n")
          s=s.replace("    assert m['persistence_contract']['cross_run_candidate_or_opportunity_caches_allowed'] is False\n", "    assert m['persistence_contract']['cross_run_candidate_or_opportunity_caches_allowed'] is False\n    assert m['persistence_contract']['0600_requires_valid_previous_1800_state'] is False\n    assert m['persistence_contract']['0600_requires_valid_current_schema_market_baseline'] is True\n    assert len(m['public_output']['sections']) == len(set(m['public_output']['sections']))\n")
          t.write_text(s,encoding='utf-8')
          PY
      - run: python -m pip install -r requirements.txt pytest
      - name: Validate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/workflows/one-shot-schema30-cleanup.yml
          git commit -m "research: clean schema30 discovery semantics"
          git push
