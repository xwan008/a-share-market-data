name: One-shot schema32 PB fallback rerun
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-schema32-pb-fix-rerun.yml']
permissions:
  contents: write
jobs:
  rerun:
    if: github.event.head_commit.message == 'run schema32 PB fallback rerun'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Harden schema32 PB and completion contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          mp=Path('config/research_pipeline_manifest.json')
          rp=Path('config/research_runtime_policy.json')
          vp=Path('skills/a-share-low-risk/valuation/SKILL.md')
          m=json.loads(mp.read_text(encoding='utf-8'))
          r=json.loads(rp.read_text(encoding='utf-8'))
          m['valuation_resolution_contract']['pb_fallback_contract']={
            'vendor_pb_missing_must_not_force_review_when_financial_statement_equity_available':True,
            'fallback_formula':'completed_session_market_cap / latest_reported_total_equity',
            'fallback_equity_basis':'latest H1 TOTAL_EQUITY; consistency cross-check only, note minority-interest approximation',
            'same_basis_required_for_level3_peer_pb':True
          }
          g=m['completion_gate_contract']
          g['nonempty_valuation_set_requires_at_least_one_complete_non_review_valuation']=True
          g['all_review_outcome_for_nonempty_valuation_set_forbidden']=True
          s=r['stage_execution_policy']
          s['vendor_pb_missing_must_use_statement_equity_fallback_before_review']=True
          s['all_review_outcome_for_nonempty_valuation_set_forbidden']=True
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding='utf-8')
          rp.write_text(json.dumps(r,ensure_ascii=False,indent=2),encoding='utf-8')
          text=vp.read_text(encoding='utf-8')
          marker='### 1.3 PB/ROE交叉验证\n'
          add='''### 1.3 PB/ROE交叉验证\nPB可优先读取可信行情口径；若行情接口缺失PB，但最新财报存在净资产，不得因此直接 review。必须先按统一口径自算：`PB = 最近完整交易日总市值 / 最新报告期净资产`。当前机械数据可使用2026H1 `TOTAL_EQUITY` 作为筛选交叉验证口径，并明确其包含少数股东权益的近似限制；同三级同行PB必须使用同一口径。\n\n'''
          if marker in text and '行情接口缺失PB' not in text:
              text=text.replace(marker,add,1)
          vp.write_text(text,encoding='utf-8')
          PY
      - name: Install
        run: python -m pip install -r requirements.txt pytest
      - name: Recover proven schema32 runner and apply PB fallback
        run: |
          curl -fsSL https://raw.githubusercontent.com/xwan008/a-share-market-data/342c5d0f79fe0786ef84b7de8467f6b8cdd7fb62/scripts/one_shot_schema32_bootstrap.py -o /tmp/schema32_loader.py
          python - <<'PY'
          import re,base64,gzip
          from pathlib import Path
          loader=Path('/tmp/schema32_loader.py').read_text(encoding='utf-8')
          m=re.search(r"payload='([^']+)'",loader)
          if not m: raise RuntimeError('historical schema32 runner payload missing')
          s=gzip.decompress(base64.b64decode(m.group(1))).decode('utf-8')
          a=s.index('def quote_metrics(code):')
          b=s.index('def history_stats(code):')
          new='''def fetch_balance(date='2026-06-30'):\n    out={}\n    for page in range(1,20):\n        params={'reportName':'RPT_DMSK_FN_BALANCE','columns':'ALL','filter':f\"(REPORT_DATE='{date}')\",'pageNumber':page,'pageSize':500,'sortColumns':'SECURITY_CODE','sortTypes':'1'}\n        try:\n            j=requests.get(URL,params=params,headers=HEAD,timeout=40).json()\n        except Exception:\n            break\n        rows=((j.get('result') or {}).get('data') or [])\n        if not rows: break\n        for r in rows:\n            c=str(r.get('SECURITY_CODE') or '').zfill(6)\n            if len(c)==6: out[c]=r\n    return out\n\n# Completed-session history stays authoritative during an open trading session.\nhist_by_code={}\nfor pref in sorted({c[:4] for c in valuation_set}):\n    hp=ROOT/'data/history_shards'/f'{pref}.json'\n    if not hp.exists(): continue\n    try: hpay=json.loads(hp.read_text(encoding='utf-8'))\n    except Exception: continue\n    for c,item in (hpay.get('stocks') or {}).items():\n        if c in survivor_members:\n            rows=[r for r in (item.get('history') or []) if num(r.get('close')) not in (None,0) and r.get('date')]\n            rows=sorted(rows,key=lambda r:str(r.get('date')))[-180:]\n            hist_by_code[c]=rows\nall_hist_dates=[str(rows[-1]['date']) for rows in hist_by_code.values() if rows]\ncompleted_trade_date=max(all_hist_dates) if all_hist_dates else latest.get('trade_date')\nbalance_h1=fetch_balance('2026-06-30')\n\n'''
          s=s[:a]+new+s[b:]
          old="""    qm=qmetrics.get(c,{})\n    dyn=(px/f['forward_eps']) if px and f and f.get('forward_eps') and f['forward_eps']>0 else None\n    ttmpe=(px/f['ttm_eps']) if px and f and f.get('ttm_eps') and f['ttm_eps']>0 else None\n    metrics[c]={'price':px,'shares':sh,'history':hs,'forward':f,'dynamic_pe':dyn,'current_pe':ttmpe or dyn,\n                'pb':qm.get('pb'),'roe':qm.get('roe_quote'),'vendor_dynamic_pe':qm.get('vendor_dynamic_pe'),'vendor_ttm_pe':qm.get('vendor_ttm_pe')}\n"""
          repl="""    dyn=(px/f['forward_eps']) if px and f and f.get('forward_eps') and f['forward_eps']>0 else None\n    ttmpe=(px/f['ttm_eps']) if px and f and f.get('ttm_eps') and f['ttm_eps']>0 else None\n    equity=num((balance_h1.get(c) or {}).get('TOTAL_EQUITY'))\n    pb=(px*sh/equity) if px and sh and equity and equity>0 else None\n    metrics[c]={'price':px,'shares':sh,'history':hs,'forward':f,'dynamic_pe':dyn,'current_pe':ttmpe or dyn,\n                'pb':pb,'roe':None,'equity_h1':equity,'pb_basis':'completed_session_market_cap / 2026H1 TOTAL_EQUITY'}\n"""
          if old not in s: raise RuntimeError('schema32 metrics patch target missing')
          s=s.replace(old,repl,1)
          s=s.replace("'pb_cross_check':pb_check,","'pb_cross_check':{**pb_check,'basis':mx.get('pb_basis'),'equity_h1':mx.get('equity_h1')},",1)
          target=" and all(x['screen_complete'] for x in screens.values()) and (not nonreview or len(near_top)>0)\n and all(v.get('safe_price_ceiling')"
          replace=" and all(x['screen_complete'] for x in screens.values()) and (not valuation_set or len(nonreview)>0) and (not nonreview or len(near_top)>0)\n and all(v.get('safe_price_ceiling')"
          if target not in s: raise RuntimeError('schema32 gate patch target missing')
          s=s.replace(target,replace,1)
          Path('scripts/_schema32_pb_fixed_runtime.py').write_text(s,encoding='utf-8')
          PY
      - name: Execute corrected schema32 bootstrap
        env: {PYTHONPATH: '${{ github.workspace }}'}
        run: python scripts/_schema32_pb_fixed_runtime.py
      - name: Contract tests
        env: {PYTHONPATH: '${{ github.workspace }}'}
        run: pytest -q
      - name: Validate non-degenerate state
        run: |
          python - <<'PY'
          import json
          s=json.load(open('data/research/v2/research_state.json',encoding='utf-8'))
          assert s['manifest_schema']==32
          assert s['status']=='research_complete'
          assert s['diagnostics']['completion_gate_passed'] is True
          v=s['diagnostics']['valuation']; b=s['diagnostics']['buy_point']
          assert v['valuation_set_count']>0
          assert v['complete_non_review_count']>0
          assert v['review_required_count'] < v['valuation_set_count']
          assert b['near_miss_output_count']>0
          samples={c:s['valuations'].get(c) for c in ['601899','601225','600096','603236'] if c in s['valuations']}
          print(json.dumps({'data_cutoff':s['data_cutoff'],'directions':s['diagnostics']['prosperity_search']['selected_direction_count'],'mapped_l3':s['diagnostics']['prosperity_search']['mapped_level3_count'],'improving_l3':s['diagnostics']['prosperity_search']['improving_level3_count'],'screened':s['diagnostics']['company_screen']['light_screen_universe_company_count'],'valuation_set':v['valuation_set_count'],'non_review':v['complete_non_review_count'],'review':v['review_required_count'],'buyable_now':b['buyable_now_count'],'near_miss':s['near_miss_ranking'],'samples':samples},ensure_ascii=False,indent=2))
          PY
      - name: Commit result and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/_schema32_pb_fixed_runtime.py
          git add config/research_pipeline_manifest.json config/research_runtime_policy.json skills/a-share-low-risk/valuation/SKILL.md data/research/v2/research_state.json
          git rm scripts/one_shot_schema32_pb_fix.py .github/workflows/one-shot-schema32-pb-fix-rerun.yml
          git commit -m "research: rerun schema32 with PB fallback"
          git pull --rebase origin main
          git push
# runtime file lives under scripts so ROOT resolves to repository