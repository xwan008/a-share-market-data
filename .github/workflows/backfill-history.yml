name: Backfill A-share rolling history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-history.yml'
      - 'scripts/backfill_history.py'
      - 'scripts/history_store.py'
      - 'scripts/build_history.py'
      - 'scripts/build_bridge.py'
      - 'tests/**'
  schedule:
    # Weekly qfq refresh repairs corporate-action/adjustment drift in the rolling history.
    - cron: '20 10 * * 6'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: a-share-market-data-write
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Refresh latest 65 sessions from Tencent qfq K-line
        run: python scripts/backfill_history.py

      - name: Build 5d/20d/60d trend and structure summary
        run: python scripts/build_history.py

      - name: Rebuild compact ChatGPT bridge files
        run: python scripts/build_bridge.py

      - name: Commit rolling history
        shell: bash
        run: |
          if git status --porcelain -- data | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A data
            git commit -m "data: refresh 65-session qfq history"

            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                exit 0
              fi
              echo "Push attempt ${attempt} failed; refreshing branch before retry."
              sleep $((attempt * 2))
            done

            echo "Failed to push history refresh after 3 attempts."
            exit 1
          else
            echo "No backfill changes to commit."
          fi

# Manual/weekly maintenance workflow. History remains bounded to 65 completed sessions.
# Partial upstream Tencent failures are committed as degraded refreshes; failed
# symbols retain their previous good history and remain individually stale until
# a later refresh succeeds.
