name: One-shot schema28 core earnings rerun
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-schema28-core-rerun.yml']
permissions:
  contents: write
jobs:
  rerun:
    if: github.event.head_commit.message == 'schema28-core-rerun'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt pytest
      - name: Rerun all company stages with deducted core earnings
        env: {PYTHONPATH: '${{ github.workspace }}'}
        run: python scripts/one_shot_schema28_core_earnings_rerun.py
      - name: Validate
        env: {PYTHONPATH: '${{ github.workspace }}'}
        run: pytest -q
      - name: Commit and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/v2/research_state.json
          git rm scripts/one_shot_schema28_core_earnings_rerun.py .github/workflows/one-shot-schema28-core-rerun.yml
          git commit -m "research: rerun schema28 on deducted core earnings"
          git push
