name: Write weekly review names
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/write_weekly_review_names.py'
      - '.github/workflows/write-weekly-review-names.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/write_weekly_review_names.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/pipeline/weekly_review_names.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: update compact weekly review names"
          git pull --rebase origin main
          git push
