name: One-shot schema26 full research rerun

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-schema26-full-research-rerun.yml'

permissions:
  contents: write

concurrency:
  group: a-share-schema26-full-research-rerun
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator
        run: pip install pytest
      - name: Execute audited research generator
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/one-shot-schema26-full-research.yml').read_text(encoding='utf-8').splitlines()
          start=next(i for i,l in enumerate(src) if "python - <<'PY'" in l)+1
          end=next(i for i in range(start,len(src)) if src[i].strip()=='PY')
          code='\n'.join((l[10:] if l.startswith('          ') else l) for l in src[start:end])+'\n'
          Path('/tmp/schema26_research.py').write_text(code,encoding='utf-8')
          PY
          python /tmp/schema26_research.py
      - name: Validate research state contract
        run: python -m pytest -q
      - name: Commit research state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/v2/research_state.json
          git commit -m "research: persist schema26 audited full research"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
