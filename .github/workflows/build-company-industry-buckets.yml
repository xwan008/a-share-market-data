name: Build company industry buckets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_company_industry_buckets.py'
      - '.github/workflows/build-company-industry-buckets.yml'
      - 'data/research/company_industry_index.json'

permissions:
  contents: write

concurrency:
  group: a-share-company-industry-buckets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build readable buckets
        run: python scripts/build_company_industry_buckets.py
      - name: Commit buckets
        shell: bash
        run: |
          if git status --porcelain -- data/research/company_buckets | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/research/company_buckets
            git commit -m "research: refresh company industry buckets"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          else
            echo "No bucket changes."
          fi
