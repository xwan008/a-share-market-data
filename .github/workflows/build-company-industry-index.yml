name: Build SW taxonomy and company industry index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-company-industry-index.yml'
      - 'scripts/build_company_industry_index.py'
      - 'requirements-research.txt'
  schedule:
    - cron: '20 9 * * 0'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: a-share-company-industry-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install research dependencies
        run: pip install -r requirements-research.txt

      - name: Build fixed SW coverage taxonomy and company index
        run: python scripts/build_company_industry_index.py --workers 6

      - name: Validate taxonomy and index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          taxonomy = json.loads(Path('config/industry_scan_universe.json').read_text(encoding='utf-8'))
          assert taxonomy['expected_counts'] == {'level1': 31, 'level2': 134, 'level3': 346}
          assert {k: len(v) for k, v in taxonomy['levels'].items()} == taxonomy['expected_counts']

          index = json.loads(Path('data/research/company_industry_index.json').read_text(encoding='utf-8'))
          assert index['schema_version'] == 2
          assert index['main_board_universe_count'] > 3000
          assert index['indexed_count'] > 3000
          for item in index['companies'].values():
              assert 'registry_broad_industry_id' not in item
          print({k: index[k] for k in ('status', 'indexed_count', 'mapped_to_sw_level3_count', 'coverage_pct')})
          PY

      - name: Commit taxonomy and company index
        shell: bash
        run: |
          if git status --porcelain -- config/industry_scan_universe.json data/research/company_industry_index.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config/industry_scan_universe.json data/research/company_industry_index.json
            git commit -m "research: refresh SW taxonomy and company index"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          else
            echo "No SW taxonomy or company-index changes."
          fi
