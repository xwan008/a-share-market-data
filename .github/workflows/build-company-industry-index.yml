name: Build company industry index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-company-industry-index.yml'
      - 'scripts/build_company_industry_index.py'
      - 'requirements-research.txt'
      - 'config/industry_scan_universe.json'
  schedule:
    # Beijing Sunday 09:20. Slow-changing taxonomy is refreshed separately from market data.
    - cron: '20 9 * * 0'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: a-share-company-industry-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install research dependencies
        run: pip install -r requirements-research.txt

      - name: Build persistent company industry index
        run: python scripts/build_company_industry_index.py --workers 6

      - name: Commit company industry index
        shell: bash
        run: |
          if git status --porcelain -- data/research/company_industry_index.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/research/company_industry_index.json
            git commit -m "research: refresh company industry index"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                exit 0
              fi
              sleep $((attempt * 2))
            done
            exit 1
          else
            echo "No company industry index changes."
          fi
