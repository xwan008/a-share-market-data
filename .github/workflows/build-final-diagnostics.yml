name: Build final diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_final_diagnostics.py'
      - '.github/workflows/build-final-diagnostics.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_final_diagnostics.py
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/pipeline/final_diagnostics.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: freeze final diagnostics"
          git pull --rebase origin main
          git push
