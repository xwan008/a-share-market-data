name: Schedule registration probe

# Diagnostic-only workflow for verifying GitHub scheduled-event registration.
# It does not fetch market data or write repository contents.
on:
  workflow_dispatch:
  schedule:
    # Existing timezone-aware probe (Asia/Shanghai).
    - cron: '7,22,37,52 * * * *'
      timezone: 'Asia/Shanghai'
    # A/B control: traditional UTC cron with no timezone field.
    # At the time of this test, the next expected UTC trigger is 10:03 UTC
    # (18:03 Asia/Shanghai), followed by the timezone-aware trigger at 18:07.
    - cron: '3,18,33,48 * * * *'

permissions:
  contents: read

concurrency:
  group: a-share-schedule-registration-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report scheduler event
        shell: bash
        run: |
          echo "event=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "workflow=${{ github.workflow }}"
          echo "run_id=${{ github.run_id }}"
          echo "sha=${{ github.sha }}"
          echo "utc_now=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
