name: Schedule registration probe

# Diagnostic-only workflow for verifying GitHub scheduled-event registration.
# It does not fetch market data or write repository contents.
on:
  workflow_dispatch:
  schedule:
    # Run on off-peak minutes so a result should appear within at most ~15 minutes.
    - cron: '7,22,37,52 * * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: read

concurrency:
  group: a-share-schedule-registration-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report scheduler event
        shell: bash
        run: |
          echo "event=${{ github.event_name }}"
          echo "workflow=${{ github.workflow }}"
          echo "run_id=${{ github.run_id }}"
          echo "sha=${{ github.sha }}"
          echo "utc_now=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
