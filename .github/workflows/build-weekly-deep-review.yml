name: Build weekly deep review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/research/pipeline/t2_company_recall.json'
      - 'scripts/build_weekly_deep_review.py'
      - 'scripts/build_run_state.py'
      - 'config/weekly_deep_review_overrides_20260830.json'
      - '.github/workflows/build-weekly-deep-review.yml'

permissions:
  contents: write

concurrency:
  group: a-share-weekly-deep-review
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Revalidate tiered company recall
        run: python scripts/validate_t2_recall_v2.py data/research/pipeline/t2_company_recall.json --industry-scan data/research/pipeline/industry_scan.json
      - name: Build weekly deep review and migrate pool
        run: python scripts/build_weekly_deep_review.py
      - name: Validate weekly scan hard contract
        run: python scripts/validate_research_outputs.py weekly-scan data/research/pipeline/weekly_opportunity_scan.json
      - name: Build stage-order run state
        run: python scripts/build_run_state.py
      - name: Validate stage order
        run: python scripts/validate_research_pipeline.py stage-order data/research/pipeline/run_state.json
      - name: Commit validated weekly deep review
        shell: bash
        run: |
          if git status --porcelain -- data/research/pipeline/weekly_deep_review.json data/research/pipeline/weekly_opportunity_scan.json data/research/weekly_fundamental_opportunity_pool.json data/research/pipeline/run_state.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/research/pipeline/weekly_deep_review.json data/research/pipeline/weekly_opportunity_scan.json data/research/weekly_fundamental_opportunity_pool.json data/research/pipeline/run_state.json
            git commit -m "research: freeze validated weekly deep review"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          else
            echo "No weekly deep-review changes."
          fi
