name: One-shot schema27 profitability baseline rerun

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-schema27-profitability-baseline-rerun.yml'

permissions:
  contents: write

concurrency:
  group: a-share-schema27-profitability-baseline-rerun
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Execute identical baseline generator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/one-shot-schema27-profitability-baseline.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=src.index(marker)+len(marker)
          end=src.index("\n          PY", start)
          block=src[start:end]
          lines=[]
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/schema27_baseline.py').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          python /tmp/schema27_baseline.py
      - name: Validate schema27 baseline contract
        run: python -m pytest -q
      - name: Commit weekly profitability baseline
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/v2/research_state.json
          if git diff --cached --quiet; then
            echo 'No state change'
          else
            git commit -m 'research: persist schema27 weekly profitability baseline'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
