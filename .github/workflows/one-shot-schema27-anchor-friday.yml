name: One-shot schema27 anchor Friday

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-schema27-anchor-friday.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Anchor schema27 weekly scan to Friday 18:00
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('config/research_pipeline_manifest.json')
          m = json.loads(p.read_text(encoding='utf-8'))
          assert m['schema_version'] == 27
          c = m['scan_cadence_contract']
          c['weekly_full_scan_interval_days'] = 7
          c['preferred_anchor'] = 'Friday 18:00 Asia/Shanghai'
          c['calendar_anchor_is_authoritative'] = True
          c['interval_days_is_max_baseline_age_not_minimum_wait'] = True
          c['successful_bootstrap_next_full_scan'] = '最近一个Friday 18:00 Asia/Shanghai，即使距离bootstrap不足7天也执行weekly_full'
          c['friday_full_scan_rule'] = '每周五18:00只要数据健康即执行weekly_full；其他工作日18:00执行daily_incremental，除非需要补做失败的周五全量'
          c['fallback'] = '若周五18:00全量失败或未运行，则下一次可用工作日18:00补做weekly_full'
          p.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sp = Path('skills/a-share-low-risk/orchestrator/SKILL.md')
          s = sp.read_text(encoding='utf-8')
          old = '扫描基本单元是申万2021 **346个三级节点**。优先锚定周五18:00；若周五没有有效运行，则下一次可用18:00补做。若当前schema没有有效周度基线，则下一次18:00无论星期几都必须先做全量普查。'
          new = '扫描基本单元是申万2021 **346个三级节点**。正式全量锚点固定为**每周五18:00（Asia/Shanghai）**；成功bootstrap后，下一次全量就是最近一个周五18:00，即使距离bootstrap不足7天。7天只表示周度基线的最大有效年龄，不是必须等待满7天。若周五全量失败或未运行，则下一次可用工作日18:00补做。若当前schema没有有效周度基线，则下一次18:00无论星期几都必须先做bootstrap全量普查。'
          assert old in s
          sp.write_text(s.replace(old, new), encoding='utf-8')

          tp = Path('tests/test_research_contract.py')
          t = tp.read_text(encoding='utf-8')
          needle = "    assert c['weekly_full_scan_interval_days'] == 7\n"
          repl = needle + "    assert c['calendar_anchor_is_authoritative'] is True\n    assert c['interval_days_is_max_baseline_age_not_minimum_wait'] is True\n    assert 'Friday 18:00' in c['successful_bootstrap_next_full_scan']\n"
          assert needle in t
          tp.write_text(t.replace(needle, repl, 1), encoding='utf-8')
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Validate
        run: python -m pytest -q
      - name: Commit and self-remove
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-schema27-anchor-friday.yml
          git add config/research_pipeline_manifest.json skills/a-share-low-risk/orchestrator/SKILL.md tests/test_research_contract.py
          git commit -m 'research: anchor schema27 full scan to Friday 18:00'
          git pull --rebase origin main
          git push origin HEAD:main
