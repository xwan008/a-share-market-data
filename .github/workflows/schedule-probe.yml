name: GitHub schedule probe

# Temporary diagnostic workflow for GitHub Actions scheduler troubleshooting.
# Safe to delete after the scheduler issue is isolated.
on:
  workflow_dispatch:
  schedule:
    # Timezone-aware probe: minute 3,13,23,33,43,53 in Asia/Shanghai.
    - cron: '3-59/10 * * * *'
      timezone: 'Asia/Shanghai'
    # UTC-default probe: minute 8,18,28,38,48,58 UTC.
    # Minutes are intentionally offset from the timezone-aware probe so the
    # triggering schedule can be distinguished in Actions history.
    - cron: '8-59/10 * * * *'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report scheduler context
        shell: bash
        run: |
          echo "event=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "sha=${{ github.sha }}"
          echo "utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "shanghai=$(TZ=Asia/Shanghai date '+%Y-%m-%dT%H:%M:%S%z')"
