name: One-time T2 freeze provenance migration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate_t2_freeze_provenance_once.py'
      - '.github/workflows/migrate-t2-freeze-provenance-once.yml'

permissions:
  contents: write

concurrency:
  group: a-share-t2-freeze-provenance-migration
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair T2 logical freeze provenance
        run: python scripts/migrate_t2_freeze_provenance_once.py
      - name: Validate repaired T2 recall
        run: python scripts/validate_t2_recall_v2.py data/research/pipeline/t2_company_recall.json --industry-scan data/research/pipeline/industry_scan.json
      - name: Validate stage-order provenance
        run: |
          python - <<'PY'
          import json,sys
          from datetime import datetime
          t2=json.load(open('data/research/pipeline/t2_company_recall.json',encoding='utf-8'))
          state=json.load(open('data/research/pipeline/run_state.json',encoding='utf-8'))
          p=lambda x: datetime.fromisoformat(x.replace('Z','+00:00'))
          ok=(p(state['industry_frozen_at']) <= p(t2['t2_recall_frozen_at']) <= p(state['weekly_pool_read_at']))
          print({'status':'PASS' if ok else 'FAIL','industry':state['industry_frozen_at'],'t2':t2['t2_recall_frozen_at'],'weekly':state['weekly_pool_read_at']})
          sys.exit(0 if ok else 2)
          PY
      - name: Commit repaired provenance
        shell: bash
        run: |
          if git status --porcelain -- data/research/pipeline/t2_company_recall.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/research/pipeline/t2_company_recall.json
            git commit -m "research: restore logical T2 freeze provenance"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          else
            echo "No provenance change needed."
          fi
