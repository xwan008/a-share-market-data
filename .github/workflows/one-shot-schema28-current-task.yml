name: One-shot schema28 current task
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-schema28-current-task.yml']
permissions:
  contents: write
jobs:
  run:
    if: github.event.head_commit.message == 'run schema28 current task v3'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt pytest
      - name: Normalize current task as daily incremental
        run: sed -i "s/'scan_mode':'baseline_reuse_company_refresh'/'scan_mode':'daily_incremental'/" scripts/one_shot_schema28_current_task.py
      - name: Execute current schema28 task from valid industry baseline
        env: {PYTHONPATH: '${{ github.workspace }}'}
        run: python scripts/one_shot_schema28_current_task.py
      - name: Validate schema28 contracts
        env: {PYTHONPATH: '${{ github.workspace }}'}
        run: pytest -q
      - name: Commit state and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/v2/research_state.json
          git checkout -- scripts/one_shot_schema28_current_task.py
          git rm scripts/one_shot_schema28_current_task.py .github/workflows/one-shot-schema28-current-task.yml
          git commit -m "research: execute schema28 current task"
          git push
