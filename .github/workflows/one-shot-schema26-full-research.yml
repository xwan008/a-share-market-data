name: One-shot schema26 full research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-schema26-full-research.yml'

permissions:
  contents: write

concurrency:
  group: a-share-schema26-full-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build schema26 audited research state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          ROOT=Path('.')
          TZ=ZoneInfo('Asia/Shanghai')
          def load(p): return json.loads((ROOT/p).read_text(encoding='utf-8'))

          manifest=load('config/research_pipeline_manifest.json')
          taxonomy=load('config/industry_scan_universe.json')
          latest=load('data/latest.json')
          ps=load('data/research/v2/full_market_price_structure.json')
          assert manifest['schema_version']==26
          assert taxonomy['expected_counts']=={'level1':31,'level2':134,'level3':346}

          trade_date=str(latest.get('trade_date') or '')
          market_status=str(latest.get('market_status') or '')
          ps_date=str(ps.get('reference_trade_date') or '')
          stocks=latest.get('stocks') or {}
          quote_usable=sum(1 for q in stocks.values() if (q or {}).get('confidence') in {'high','medium'})
          ps_verified=int(ps.get('verified_count') or 0)

          history_ge60=0
          history_ge120=0
          for path in sorted(Path('data/history_shards').glob('*.json')):
              payload=json.loads(path.read_text(encoding='utf-8'))
              for item in (payload.get('stocks') or {}).values():
                  n=len(item.get('history') or [])
                  history_ge60 += int(n>=60)
                  history_ge120 += int(n>=120)

          data_health_passed=(market_status=='closed' and bool(trade_date) and ps_date==trade_date and quote_usable>=3000 and history_ge60>=3000 and ps_verified>=3000)

          # Current-run public-evidence classification. All nodes are instantiated first.
          # Defaults mean: node was checked in the cross-sectional pass, but no sufficient
          # node-specific evidence was found to upgrade it. This is deliberately NOT 'stable'.
          deep={
            # level1
            'S22':('improving','cross_sectional','2026H1 A股半年报收官数据指向化工资源品盈利改善；但基础化工内部产品/价差Driver差异大，需继续分链。','unconfirmed_with_evidence_gap'),
            'S24':('strong_improving','cross_sectional','2026H1 有色金属处于一级行业盈利增幅前列，铜与锂均有公司级盈利兑现。','resolved'),
            'S27':('strong_improving','cross_sectional','2026H1 电子为31个申万一级行业中唯一归母净利润翻倍行业；内部半导体、PCB等Driver分化。','resolved'),
            'S49':('strong_improving','cross_sectional','2026H1 非银金融盈利增幅居前；二级多元金融增速超过100%，但本次未形成足够纯度的主板盈利链。','unconfirmed_with_evidence_gap'),
            'S65':('divergent','cross_sectional','航海装备盈利高增，但军工其他子行业盈利机制并不相同，一级国防军工按分化处理。','resolved'),
            'S75':('improving','cross_sectional','沪市石油石化2026H1净利润同比增长约25.9%，但油气开采/油服/炼化Driver不同。','unconfirmed_with_evidence_gap'),
            # level2
            'S2202':('improving','cross_sectional','化学原料处于盈利修复方向，但煤化工/氯碱/纯碱等价差机制不同，本次证据不足以合并为单一可比链。','unconfirmed_with_evidence_gap'),
            'S2403':('improving','direct_node','工业金属受价格中枢与资源端收益改善驱动；铜公司盈利兑现显著。','resolved'),
            'S2406':('strong_improving','direct_node','申万二级能源金属2026H1盈利增速超过500%，锂价中枢抬升并兑现至龙头盈利。','resolved'),
            'S2701':('strong_improving','direct_node','申万二级半导体2026H1盈利增速超过500%，但设备环节内部利润增速明显分化。','resolved'),
            'S2702':('improving','direct_node','AI服务器/高速交换机需求直接拉动高端PCB收入、毛利率与利润增长。','resolved'),
            'S2704':('strong_improving','cross_sectional','申万二级其他电子2026H1盈利增速超过100%，但本次没有完成足够细的主板可比盈利链。','unconfirmed_with_evidence_gap'),
            'S4903':('strong_improving','cross_sectional','申万二级多元金融2026H1盈利增速超过100%，但内部期货/租赁/金融信息服务Driver不同。','unconfirmed_with_evidence_gap'),
            'S6504':('strong_improving','direct_node','申万二级航海装备2026H1盈利增速超过100%，船舶交付量、高价值船型占比与价格改善兑现至利润。','resolved'),
            'S7503':('improving','parent_supported','石油石化一级盈利改善，炼化链存在利润修复信号，但产品价差证据不足以给出单一主板机会链。','unconfirmed_with_evidence_gap'),
            # level3
            'S240302':('improving','direct_node','铜价/矿端资源收益改善，江西铜业和紫金矿业2026H1利润与经营现金流均显著增长。','resolved'),
            'S240603':('strong_improving','direct_node','锂产品价格回升叠加销量增长，天齐锂业与赣锋锂业2026H1盈利大幅修复。','resolved'),
            'S270108':('divergent','direct_node','27家半导体设备公司营收同比约+31%，行业利润高增，但北方华创归母仅+5%，显示明显结构分化。','unconfirmed_with_evidence_gap'),
            'S270202':('strong_improving','direct_node','AI服务器与高速交换机订单拉动沪电股份、深南电路PCB收入和扣非利润高增长。','resolved'),
            'S650401':('strong_improving','direct_node','中国船舶与中船防务2026H1盈利、现金流明显改善，直接受益于船舶交付与高价值船型。','resolved'),
          }
          weak={
            'S43':('weak','cross_sectional','2026H1半年报汇总显示房地产板块较多亏损，需求与盈利仍偏弱。'),
            'S62':('weak','cross_sectional','2026H1半年报汇总显示建筑装饰板块较多亏损，暂未看到足够强的盈利改善。'),
            'S11':('weak','cross_sectional','2026H1半年报汇总显示农林牧渔板块较多亏损，整体盈利承压。'),
          }

          ledger={'level1':[],'level2':[],'level3':[]}
          for level in ('level1','level2','level3'):
              for node in taxonomy['levels'][level]:
                  code=node['code']
                  row={
                    'code':code,'name':node['name'],'level':level,'parent_code':node['parent_code'],
                    'accounted_for':True,'status':'unconfirmed','scan_depth':'shallow','evidence_scope':'insufficient',
                    'evidence_basis':'本期已纳入全市场申万节点横截面检查；未获得足以把该具体节点升级为改善/恶化/分化的节点级可靠公开证据，故保留unconfirmed，不解释为稳定或没有机会。',
                    'needs_profit_chain_research':False,'profit_chain_resolution':'not_required'
                  }
                  if code in weak:
                      s,scope,basis=weak[code]
                      row.update(status=s,evidence_scope=scope,evidence_basis=basis)
                  if code in deep:
                      s,scope,basis,res=deep[code]
                      row.update(status=s,scan_depth='deep',evidence_scope=scope,evidence_basis=basis,needs_profit_chain_research=True,profit_chain_resolution=res)
                  ledger[level].append(row)

          evidence_sources={
            'a_share_h1':'https://www.cls.cn/detail/2469547',
            'a_share_h1_structure':'https://paper.cnstock.com/html/2026-08/31/content_2263446.htm',
            'sse_h1':'https://paper.cnstock.com/html/2026-08/31/content_2263452.htm',
            'semi_equipment':'https://finance.eastmoney.com/a/202608313859607178.html',
            'north_huachuang':'https://finance.eastmoney.com/a/202608253853310020.html',
            'hudien':'https://finance.eastmoney.com/a/202608253853519292.html',
            'shennan':'https://data.eastmoney.com/report/info/AP202608271828552163.html',
            'tianqi':'https://www.stcn.com/article/detail/4144291.html',
            'ganfeng':'https://finance.eastmoney.com/a/202608293859296168.html',
            'jiangxi_copper':'https://finance.eastmoney.com/a/202608263854307587.html',
            'zijin':'https://finance.eastmoney.com/a/202608223850170087.html',
            'cssc':'https://finance.eastmoney.com/a/202608313859970169.html',
            'cssc_offshore':'https://finance.eastmoney.com/a/202608263854313076.html'
          }

