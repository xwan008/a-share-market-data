name: Build T2 company recall

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/research/pipeline/industry_scan.json'
      - 'config/t2_exposure_rules.json'
      - 'scripts/company_index_fingerprint.py'
      - 'scripts/build_t2_recall_from_rules.py'
      - 'scripts/validate_t2_recall_v2.py'
      - 'scripts/validate_research_pipeline.py'
      - '.github/workflows/build-t2-recall.yml'

permissions:
  contents: write

concurrency:
  group: a-share-t2-recall
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build T2 recall from mechanical rules
        run: python scripts/build_t2_recall_from_rules.py
      - name: Validate T2 recall hard contract
        run: python scripts/validate_t2_recall_v2.py data/research/pipeline/t2_company_recall.json --industry-scan data/research/pipeline/industry_scan.json
      - name: Commit validated T2 recall
        shell: bash
        run: |
          if git status --porcelain -- data/research/pipeline/t2_company_recall.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/research/pipeline/t2_company_recall.json
            git commit -m "research: freeze validated T2 company recall"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          else
            echo "No T2 recall changes."
          fi
