name: Update A-share market data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Update mode: intraday or full'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - intraday
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-market.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
  schedule:
    # Beijing time.
    # 12:10: lightweight quote/bridge refresh for the 12:20 analysis window.
    # 16:10: full post-close build; 16:30: retry/fallback full build.
    - cron: '10 12 * * 1-5'
      timezone: 'Asia/Shanghai'
    - cron: '10 16 * * 1-5'
      timezone: 'Asia/Shanghai'
    - cron: '30 16 * * 1-5'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: a-share-market-data-write
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Resolve update mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "10 12 * * 1-5" ]]; then
            echo "mode=intraday" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.mode }}" == "intraday" ]]; then
            echo "mode=intraday" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install test dependency
        if: steps.mode.outputs.mode == 'full'
        run: pip install pytest

      - name: Run tests
        if: steps.mode.outputs.mode == 'full'
        run: python -m pytest -q

      - name: Fetch and validate quotes
        run: python scripts/fetch_market.py

      - name: Detect and repair corporate-action qfq drift
        if: steps.mode.outputs.mode == 'full'
        run: python scripts/repair_corporate_actions.py

      - name: Append closed session to bounded rolling history
        if: steps.mode.outputs.mode == 'full'
        run: python scripts/history_store.py

      - name: Build 5d/20d/60d trend, density, volume and structure summary
        if: steps.mode.outputs.mode == 'full'
        run: python scripts/build_history.py

      - name: Build compact ChatGPT bridge files
        run: python scripts/build_bridge.py

      - name: Commit updated data
        shell: bash
        run: |
          if git status --porcelain -- data | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A data
            git commit -m "data: update A-share snapshot and rolling history"

            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                exit 0
              fi
              echo "Push attempt ${attempt} failed; refreshing branch before retry."
              sleep $((attempt * 2))
            done

            echo "Failed to push market data after 3 attempts."
            exit 1
          else
            echo "No market-data changes to commit."
          fi

# Intraday mode updates current quote/bridge files only; it does not append the
# unfinished candle or recompute confirmed daily pivots/HH/HL/LH/LL.
# Full mode runs after the close and owns tests, corporate-action repair,
# rolling-history append, and 5d/20d/60d structure recomputation.
# The 06:20 analysis consumes the previous post-close full build, so no 06:10
# market-data workflow is required.
