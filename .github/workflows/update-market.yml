name: Update A-share market data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-market.yml'
  schedule:
    # Beijing time. Two attempts around each target window reduce transient failures.
    - cron: '37 11 * * 1-5'
      timezone: 'Asia/Shanghai'
    - cron: '52 11 * * 1-5'
      timezone: 'Asia/Shanghai'
    - cron: '12 15 * * 1-5'
      timezone: 'Asia/Shanghai'
    - cron: '27 15 * * 1-5'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: a-share-market-data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and validate quotes
        run: python scripts/fetch_market.py

      - name: Append current session to bounded rolling history
        run: python scripts/history_store.py

      - name: Build 5d/20d trend summary
        run: python scripts/build_history.py

      - name: Build compact ChatGPT bridge files
        run: python scripts/build_bridge.py

      - name: Commit updated data
        shell: bash
        run: |
          if git status --porcelain -- data | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A data
            git commit -m "data: update A-share snapshot and rolling history"
            git pull --rebase origin main
            git push
          else
            echo "No market-data changes to commit."
          fi

# Rolling history is bounded to 25 sessions per stock.
