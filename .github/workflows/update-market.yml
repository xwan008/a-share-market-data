name: Update A-share market data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-market.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
  schedule:
    # Beijing time. Two attempts around each target window reduce transient failures.
    - cron: '37 11 * * 1-5'
      timezone: 'Asia/Shanghai'
    - cron: '52 11 * * 1-5'
      timezone: 'Asia/Shanghai'
    - cron: '12 15 * * 1-5'
      timezone: 'Asia/Shanghai'
    - cron: '27 15 * * 1-5'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: a-share-market-data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Fetch and validate quotes
        run: python scripts/fetch_market.py

      - name: Detect and repair corporate-action qfq drift
        run: python scripts/repair_corporate_actions.py

      - name: Append closed session to bounded rolling history
        run: python scripts/history_store.py

      - name: Build 5d/20d/60d trend, density, volume and structure summary
        run: python scripts/build_history.py

      - name: Build compact ChatGPT bridge files
        run: python scripts/build_bridge.py

      - name: Commit updated data
        shell: bash
        run: |
          if git status --porcelain -- data | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A data
            git commit -m "data: update A-share snapshot and rolling history"

            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                exit 0
              fi
              echo "Push attempt ${attempt} failed; refreshing branch before retry."
              sleep $((attempt * 2))
            done

            echo "Failed to push market data after 3 attempts."
            exit 1
          else
            echo "No market-data changes to commit."
          fi

# Intraday/morning snapshots update current quote files only.
# Corporate-action repair may refresh affected completed qfq history intraday,
# but the current unfinished candle is explicitly excluded.
# Rolling history accepts only market_status=closed and remains capped at 65 sessions per stock.
