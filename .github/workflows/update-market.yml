name: Update A-share market data

# Consolidated post-close pipeline: quote/history/bridge/price-structure refresh together.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-market.yml'
      - 'scripts/fetch_market.py'
      - 'scripts/repair_corporate_actions.py'
      - 'scripts/history_store.py'
      - 'scripts/build_history.py'
      - 'scripts/build_bridge.py'
      - 'scripts/build_v2_full_market_price_structure.py'
      - 'requirements.txt'
  schedule:
    - cron: '10 16 * * 1-5'
      timezone: 'Asia/Shanghai'
    - cron: '30 16 * * 1-5'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: a-share-market-data-write
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main for scheduled/manual reruns
        if: github.event_name != 'push'
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Fetch and validate closed-session quotes
        run: python scripts/fetch_market.py
      - name: Detect and repair corporate-action qfq drift
        run: python scripts/repair_corporate_actions.py
      - name: Append closed session to bounded rolling history
        run: python scripts/history_store.py
      - name: Build market history summaries
        run: python scripts/build_history.py
      - name: Build compact ChatGPT bridge files
        run: python scripts/build_bridge.py
      - name: Build full-market low-risk price structure
        run: python scripts/build_v2_full_market_price_structure.py
      - name: Commit updated data
        shell: bash
        run: |
          if git status --porcelain -- data | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A data
            git commit -m "data: update A-share snapshot and rolling history"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          else
            echo "No market-data changes to commit."
          fi

# Only completed daily sessions are persisted. The same post-close workflow also
# refreshes the mechanical full-market price-structure input consumed by research.
