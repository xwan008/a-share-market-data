name: Update A-share market data

# Consolidated post-close pipeline: quote/history/bridge/price-structure refresh together.
# Code pushes are validated by CI and never write market data.
on:
  workflow_dispatch:
  schedule:
    # Primary post-close run in Beijing/Shanghai local time.
    - cron: '10 16 * * 1-5'
      timezone: 'Asia/Shanghai'
    # Second post-close retry window.
    - cron: '30 16 * * 1-5'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: a-share-market-data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Fetch market snapshot
        run: python scripts/fetch_market_resilient.py
      - name: Check completed-session persistence gate
        id: session
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          latest = json.loads(Path('data/latest.json').read_text(encoding='utf-8'))
          trade_date = str(latest.get('trade_date') or '')
          status = str(latest.get('market_status') or '')
          stocks = latest.get('stocks') or {}
          total = len(stocks)

          source_status = latest.get('source_status') or {}
          source_errors = source_status.get('errors') or []
          source_ok = [name for name in ('sina', 'tencent') if source_status.get(name) == 'ok']

          validation = latest.get('validation_stats') or {}
          high = int(validation.get('high') or 0)
          medium = int(validation.get('medium') or 0)
          invalid = int(validation.get('invalid') or 0)
          usable = high + medium
          quote_coverage = (usable / total) if total else 0.0
          invalid_ratio = (invalid / total) if total else 1.0
          quote_gate = bool(total >= 3000 and quote_coverage >= 0.99 and invalid_ratio <= 0.01)

          fundamental = latest.get('fundamental_stats') or {}
          fundamental_errors = fundamental.get('errors') or []
          valuation_usable = int(fundamental.get('valuation_usable') or 0)
          financial_usable = int(fundamental.get('financial_usable') or 0)
          valuation_coverage = (valuation_usable / total) if total else 0.0
          financial_coverage = (financial_usable / total) if total else 0.0
          fundamental_gate = bool(
              valuation_coverage >= 0.95
              and financial_coverage >= 0.95
              and not fundamental_errors
          )

          source_gate = bool(source_ok)
          quality_mode = 'dual_source' if len(source_ok) >= 2 else 'single_source_degraded'
          persist = bool(
              trade_date
              and status == 'closed'
              and source_gate
              and quote_gate
              and fundamental_gate
          )

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"persist={'true' if persist else 'false'}\n")
          print(json.dumps({
              'trade_date': trade_date,
              'market_status': status,
              'quality_mode': quality_mode,
              'source_ok': source_ok,
              'source_errors': source_errors,
              'quote_coverage': round(quote_coverage, 6),
              'invalid_ratio': round(invalid_ratio, 6),
              'valuation_coverage': round(valuation_coverage, 6),
              'financial_coverage': round(financial_coverage, 6),
              'fundamental_errors': fundamental_errors,
              'persist': persist,
          }, ensure_ascii=False))
          PY
      - name: Detect and repair corporate-action qfq drift
        if: steps.session.outputs.persist == 'true'
        run: python scripts/repair_corporate_actions.py
      - name: Append closed session to bounded rolling history
        if: steps.session.outputs.persist == 'true'
        run: python scripts/history_store.py
      - name: Build market history summaries
        if: steps.session.outputs.persist == 'true'
        run: python scripts/build_history.py
      - name: Build compact ChatGPT bridge files
        if: steps.session.outputs.persist == 'true'
        run: python scripts/build_bridge.py
      - name: Embed SW level3 industry into quote shards
        if: steps.session.outputs.persist == 'true'
        run: python scripts/enrich_shards_with_industry.py
      - name: Build full-market low-risk price structure
        if: steps.session.outputs.persist == 'true'
        run: python scripts/build_full_market_price_structure.py
      - name: Commit updated data
        if: steps.session.outputs.persist == 'true'
        shell: bash
        run: |
          if git status --porcelain -- data | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A data
            git commit -m "data: update A-share snapshot and rolling history"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          else
            echo "No market-data changes to commit."
          fi
      - name: Build locked-commit runtime manifest
        if: steps.session.outputs.persist == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          payload = {
              'schema_version': 1,
              'repo': 'xwan008/a-share-market-data',
              'commit_sha': sha,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'snapshot_kind': 'chatgpt_runtime_locked_commit',
          }
          Path('runtime_snapshot_manifest.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          print(json.dumps(payload, ensure_ascii=False))
          PY
      - name: Upload locked-commit runtime snapshot
        if: steps.session.outputs.persist == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: a-share-runtime-snapshot
          path: |
            runtime_snapshot_manifest.json
            config/industry_scan_universe.json
            data/health.json
            data/research/industry_state.json
            data/research/full_market_price_structure.json
            data/shards/*.json
            data/history_shards/*.json
            skills/a-share-low-risk/company-research/SKILL.md
            skills/a-share-low-risk/valuation/SKILL.md
            skills/a-share-low-risk/price-structure/SKILL.md
          if-no-files-found: error
          retention-days: 3
      - name: Report skipped persistence
        if: steps.session.outputs.persist != 'true'
        run: echo "Market snapshot did not pass the completed-session quality gate; no repository data will be persisted."

# Completed daily sessions may persist in dual-source mode or verified single-source degraded mode.
# Single-source fallback still requires >=99% usable quote coverage, <=1% invalid quotes,
# and >=95% valuation/financial coverage with no fundamental-source errors.
# Runtime snapshot publication is part of this same run because pushes created with GITHUB_TOKEN
# do not recursively trigger a second push-based Actions workflow.
