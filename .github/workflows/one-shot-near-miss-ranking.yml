name: One-shot near-miss ranking contract
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-near-miss-ranking.yml']
permissions:
  contents: write
jobs:
  run:
    if: github.event.head_commit.message == 'run add near miss ranking'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt pytest
      - name: Add near-miss output contract and derive current ranking
        env: {PYTHONPATH: '${{ github.workspace }}'}
        run: python scripts/one_shot_add_near_miss_ranking.py
      - name: Validate contracts
        env: {PYTHONPATH: '${{ github.workspace }}'}
        run: pytest -q
      - name: Commit contract and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/research_pipeline_manifest.json skills/a-share-low-risk/orchestrator/SKILL.md tests/test_near_miss_ranking_contract.py
          git rm scripts/one_shot_add_near_miss_ranking.py .github/workflows/one-shot-near-miss-ranking.yml
          git commit -m "research: require near-miss buy-point ranking"
          git push
