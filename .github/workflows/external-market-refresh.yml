name: External market refresh bridge

# Reliable bridge for external schedulers. A push to the sentinel file dispatches
# the canonical market-data workflow; GitHub schedule remains only a fallback.
on:
  push:
    branches:
      - main
    paths:
      - '.github/market-refresh-trigger.txt'

permissions:
  actions: write
  contents: read

concurrency:
  group: a-share-external-refresh-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical market update workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-market.yml --repo "$GITHUB_REPOSITORY" --ref main
