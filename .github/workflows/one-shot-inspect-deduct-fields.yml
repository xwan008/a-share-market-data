name: One-shot inspect deduct fields
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-inspect-deduct-fields.yml']
permissions:
  contents: write
jobs:
  inspect:
    if: github.event.head_commit.message == 'inspect-deduct-fields'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - name: Inspect Eastmoney fields
        run: |
          python - <<'PY'
          import requests,json
          u='https://datacenter-web.eastmoney.com/api/data/v1/get'
          p={'reportName':'RPT_LICO_FN_CPD','columns':'ALL','filter':"(REPORTDATE='2026-06-30')",'pageNumber':1,'pageSize':500,'sortColumns':'SECURITY_CODE','sortTypes':'1'}
          for page in range(1,30):
            p['pageNumber']=page
            j=requests.get(u,params=p,headers={'User-Agent':'Mozilla/5.0'},timeout=30).json()
            rows=((j.get('result') or {}).get('data') or [])
            for r in rows:
              if str(r.get('SECURITY_CODE'))=='002452':
                print('MATCHING_FIELDS')
                print(json.dumps({k:v for k,v in r.items() if any(x in k.upper() for x in ['NETPROFIT','DEDUCT','KCF','EPS','NONREC','EXTRA'])},ensure_ascii=False,indent=2))
                print('ALL_KEYS')
                print(json.dumps(list(r.keys()),ensure_ascii=False))
                raise SystemExit
            if not rows: break
          print('NOT_FOUND')
          PY
      - name: Self remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-inspect-deduct-fields.yml
          git commit -m "ci: remove deduct-field inspection workflow"
          git push
