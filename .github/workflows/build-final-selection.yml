name: Build final low-risk selection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_final_selection.py'
      - '.github/workflows/build-final-selection.yml'

concurrency:
  group: final-selection-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Revalidate weekly scan
        run: python scripts/validate_research_outputs.py weekly-scan data/research/pipeline/weekly_opportunity_scan.json
      - name: Revalidate valuation policy coverage
        run: python scripts/validate_research_outputs.py valuation-policy-audit data/research/pipeline/valuation_policy_audit.json
      - name: Revalidate merged left valuation
        run: python scripts/validate_research_outputs.py left-valuation data/research/pipeline/left_valuation_scan.json
      - name: Build final intersection and hard-gate selection
        run: python scripts/build_final_selection.py
      - name: Validate final selection
        run: python scripts/validate_research_outputs.py final-selection data/research/pipeline/final_selection.json
      - name: Commit final selection
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/pipeline/final_selection.json data/research/pipeline/final_selection_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: freeze final low-risk selection"
          git pull --rebase origin main
          git push
