name: Build low-risk V2 shadow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'skills/a-share-low-risk/**'
      - 'config/research_pipeline_manifest.json'
      - 'scripts/build_v2_earnings_anomaly_recall.py'
      - 'scripts/build_v2_full_market_price_structure.py'
      - 'scripts/build_v2_shadow_crosscheck.py'
      - 'scripts/validate_v2_blueprint.py'
      - '.github/workflows/build-low-risk-v2-shadow.yml'
  schedule:
    # update-market runs at 16:10 and 16:30 Beijing time. Run V2 mechanical
    # shadow scans after those closed-session refreshes.
    - cron: '50 16 * * 1-5'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: a-share-low-risk-v2-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh scheduled run to latest main
        if: github.ref_name == 'main'
        shell: bash
        run: |
          git fetch origin main
          git merge --ff-only origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install research dependencies
        run: pip install -r requirements-research.txt
      - name: Build full-market earnings anomaly recall
        run: python scripts/build_v2_earnings_anomaly_recall.py
      - name: Build independent full-market price structure
        run: python scripts/build_v2_full_market_price_structure.py
      - name: Build case-free mechanical crosscheck
        run: python scripts/build_v2_shadow_crosscheck.py
      - name: Validate V2 case-free invariants
        run: python scripts/validate_v2_blueprint.py
      - name: Print market-wide structure summary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/research/v2/full_market_price_structure.json',encoding='utf-8'))
          c=json.load(open('data/research/v2/shadow_crosscheck.json',encoding='utf-8'))
          print(json.dumps({
            'universe_count':p.get('universe_count'),
            'verified_count':p.get('verified_count'),
            'structure_type_counts':p.get('structure_type_counts'),
            'right_candidate_count':len(p.get('right_candidate_codes',[])),
            'crosscheck_counts':c.get('counts')
          },ensure_ascii=False,indent=2))
          PY
      - name: Commit shadow mechanical outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/v2/earnings_anomaly_recall.json data/research/v2/full_market_price_structure.json data/research/v2/shadow_crosscheck.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research-v2: refresh shadow mechanical scans"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
