name: One-shot inspect balance equity fields
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-inspect-balance-equity.yml']
permissions:
  contents: write
jobs:
  inspect:
    if: github.event.head_commit.message == 'inspect balance equity fields'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - name: Inspect
        run: |
          python - <<'PY'
          import requests,json
          u='https://datacenter-web.eastmoney.com/api/data/v1/get'
          p={'reportName':'RPT_DMSK_FN_BALANCE','columns':'ALL','filter':"(REPORT_DATE='2026-06-30')",'pageNumber':1,'pageSize':500,'sortColumns':'SECURITY_CODE','sortTypes':'1'}
          for page in range(1,15):
            p['pageNumber']=page
            rows=((requests.get(u,params=p,headers={'User-Agent':'Mozilla/5.0'},timeout=40).json().get('result') or {}).get('data') or [])
            for r in rows:
              if str(r.get('SECURITY_CODE')) in {'601899','601225','600096','603236'}:
                print('CODE',r.get('SECURITY_CODE'))
                print(json.dumps({k:v for k,v in r.items() if any(x in k.upper() for x in ['EQUITY','PARENT','OWNER','SHAREHOLDER','ASSET','LIAB'])},ensure_ascii=False,indent=2))
                print('ALL_KEYS',json.dumps(list(r.keys()),ensure_ascii=False))
            if not rows: break
          PY
      - name: Cleanup
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-inspect-balance-equity.yml
          git commit -m "ci: remove balance equity inspection"
          git push
