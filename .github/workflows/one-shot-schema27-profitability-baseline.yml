name: One-shot schema27 profitability baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-schema27-profitability-baseline.yml'

permissions:
  contents: write

concurrency:
  group: a-share-schema27-profitability-baseline
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Build 346-node profitability baseline
        shell: bash
        run: |
          python - <<'PY'
          import json, math, statistics, time
          from collections import defaultdict
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import requests

          ROOT = Path('.')
          TZ = ZoneInfo('Asia/Shanghai')
          NOW = datetime.now(TZ)
          BASELINE_DATE = NOW.date().isoformat()
          API = 'https://datacenter-web.eastmoney.com/api/data/v1/get'
          HEADERS = {'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'}

          def load(path):
              return json.loads((ROOT/path).read_text(encoding='utf-8'))

          manifest = load('config/research_pipeline_manifest.json')
          taxonomy = load('config/industry_scan_universe.json')
          index = load('data/research/company_industry_index.json')
          assert manifest['schema_version'] == 27
          assert taxonomy['expected_counts'] == {'level1':31,'level2':134,'level3':346}

          companies = {
              code: rec for code, rec in (index.get('companies') or {}).items()
              if rec.get('mapping_status') == 'mapped' and rec.get('sw_level3_code')
          }
          mapped_codes = set(companies)
          assert len(mapped_codes) >= 3000, len(mapped_codes)

          session = requests.Session()
          session.headers.update(HEADERS)

          def fetch_report(report_date):
              out = {}
              page = 1
              pages = 1
              while page <= pages:
                  params = {
                      'sortColumns':'REPORTDATE,SECURITY_CODE',
                      'sortTypes':'-1,1',
                      'pageSize':'500',
                      'pageNumber':str(page),
                      'reportName':'RPT_LICO_FN_CPD',
                      'columns':'ALL',
                      'filter':f"(REPORTDATE='{report_date}')",
                      'source':'WEB',
                      'client':'WEB',
                  }
                  last_err = None
                  for attempt in range(4):
                      try:
                          r = session.get(API, params=params, timeout=30)
                          r.raise_for_status()
                          payload = r.json()
                          result = payload.get('result') or {}
                          data = result.get('data') or []
                          pages = int(result.get('pages') or 1)
                          for row in data:
                              code = str(row.get('SECURITY_CODE') or '').zfill(6)
                              if code in mapped_codes:
                                  out[code] = row
                          last_err = None
                          break
                      except Exception as exc:
                          last_err = exc
                          time.sleep(2 * (attempt + 1))
                  if last_err is not None:
                      raise RuntimeError(f'fetch {report_date} page {page} failed: {last_err}')
                  page += 1
              return out

          current = fetch_report('2026-06-30')
          previous = fetch_report('2025-06-30')

          current_cov = len(current) / len(mapped_codes)
          pair_codes = mapped_codes & set(current) & set(previous)
          pair_cov = len(pair_codes) / len(mapped_codes)
          print(f'mapped={len(mapped_codes)} current_h1={len(current)} previous_h1={len(previous)} pair={len(pair_codes)} current_cov={current_cov:.3%} pair_cov={pair_cov:.3%}')
          if current_cov < 0.90 or pair_cov < 0.85:
              raise SystemExit(f'financial evidence coverage insufficient: current={current_cov:.3%}, paired={pair_cov:.3%}')

          def num(v):
              try:
                  if v is None or v == '': return None
                  x = float(v)
                  return x if math.isfinite(x) else None
              except Exception:
                  return None

          by_l3 = defaultdict(list)
          for code, rec in companies.items():
              by_l3[rec['sw_level3_code']].append(code)

          def growth(curr, prev):
              if curr is None or prev is None: return None
              if abs(prev) < 1e-9: return None
              return (curr - prev) / abs(prev)

          def fmt_pct(x):
              return 'NA' if x is None else f'{x*100:.1f}%'

          def classify_l3(node):
              codes = by_l3.get(node['code'], [])
              cur_codes = [c for c in codes if c in current]
              pairs = [c for c in codes if c in current and c in previous]
              n_total, n_cur, n_pair = len(codes), len(cur_codes), len(pairs)
              coverage = n_cur / n_total if n_total else 0.0

              cur_rev = sum(num(current[c].get('TOTAL_OPERATE_INCOME')) or 0.0 for c in pairs)
              pre_rev = sum(num(previous[c].get('TOTAL_OPERATE_INCOME')) or 0.0 for c in pairs)
              cur_np = sum(num(current[c].get('PARENT_NETPROFIT')) or 0.0 for c in pairs)
              pre_np = sum(num(previous[c].get('PARENT_NETPROFIT')) or 0.0 for c in pairs)
              rev_g = growth(cur_rev, pre_rev) if pairs else None
              np_g = growth(cur_np, pre_np) if pairs else None

              improve_flags=[]
              rev_flags=[]
              gm_deltas=[]
              for c in pairs:
                  cnp=num(current[c].get('PARENT_NETPROFIT')); pnp=num(previous[c].get('PARENT_NETPROFIT'))
                  cr=num(current[c].get('TOTAL_OPERATE_INCOME')); pr=num(previous[c].get('TOTAL_OPERATE_INCOME'))
                  if cnp is not None and pnp is not None: improve_flags.append(cnp > pnp)
                  if cr is not None and pr is not None: rev_flags.append(cr > pr)
                  cgm=num(current[c].get('XSMLL')); pgm=num(previous[c].get('XSMLL'))
                  if cgm is not None and pgm is not None: gm_deltas.append(cgm-pgm)

              profit_breadth = sum(improve_flags)/len(improve_flags) if improve_flags else None
              revenue_breadth = sum(rev_flags)/len(rev_flags) if rev_flags else None
              gm_median_delta = statistics.median(gm_deltas) if gm_deltas else None

              # Real-evidence availability: one-company industries can still be judged with full paired data.
              evidence_ok = n_total > 0 and n_cur >= 1 and n_pair >= 1 and coverage >= 0.50
              if not evidence_ok:
                  trend='unconfirmed'; strength='unknown'; breadth='unknown'
              else:
                  turnaround = pre_np <= 0 < cur_np
                  breakdown = cur_np <= 0 < pre_np
                  # Aggregate profit is the primary direction; revenue/breadth prevents one-off classification.
                  if turnaround or (np_g is not None and np_g >= 0.15) or (np_g is not None and np_g >= 0.05 and (profit_breadth or 0) >= 0.60):
                      trend='improving'
                  elif breakdown or (np_g is not None and np_g <= -0.15) or (np_g is not None and np_g <= -0.05 and (profit_breadth if profit_breadth is not None else 1) <= 0.40):
                      trend='deteriorating'
                  else:
                      trend='stable'

                  mag = abs(np_g) if np_g is not None else 0.0
                  if turnaround or breakdown or mag >= 0.50:
                      strength='strong'
                  elif mag >= 0.15:
                      strength='normal'
                  else:
                      strength='weak'

                  pb = profit_breadth
                  if pb is None:
                      breadth='unknown'
                  elif trend == 'improving':
                      if pb >= 0.67: breadth='broad'
                      elif pb >= 0.35: breadth='divergent'
                      else: breadth='selective'
                  elif trend == 'deteriorating':
                      deterioration_share = 1-pb
                      if deterioration_share >= 0.67: breadth='broad'
                      elif deterioration_share >= 0.35: breadth='divergent'
                      else: breadth='selective'
                  else:
                      breadth='divergent' if 0.35 <= pb <= 0.65 else 'broad'

              if n_total and coverage >= 0.85 and n_pair >= min(5, n_total):
                  confidence='high'
              elif n_total and coverage >= 0.60 and n_pair >= 1:
                  confidence='medium'
              else:
                  confidence='low'

              must_deep = trend in {'improving','deteriorating'} or breadth in {'selective','divergent'}
              if n_total == 0:
                  basis=f"2026H1/2025H1公开财务横截面复核：当前主板公司申万映射中该三级节点无可用公司样本，因此趋势不确认。"
              elif n_pair == 0:
                  basis=f"2026H1/2025H1公开财务横截面复核：映射主板{n_total}家，2026H1已取{n_cur}家，但缺可同比配对样本，趋势不确认。"
              else:
                  turn='；板块归母由亏转盈' if pre_np <= 0 < cur_np else ('；板块归母由盈转亏' if cur_np <= 0 < pre_np else '')
                  basis=(f"2026H1/2025H1公开财务横截面：映射主板{n_total}家，H1取数{n_cur}家，同比配对{n_pair}家，覆盖{coverage*100:.0f}%；"
                         f"配对口径营收同比{fmt_pct(rev_g)}，归母净利润同比{fmt_pct(np_g)}{turn}；"
                         f"盈利改善公司占比{fmt_pct(profit_breadth)}，营收增长公司占比{fmt_pct(revenue_breadth)}，"
                         f"毛利率中位变化{'NA' if gm_median_delta is None else f'{gm_median_delta:+.2f}pct'}。")

              return {
                  'code':node['code'],'name':node['name'],'level':'level3','parent_code':node['parent_code'],
                  'accounted_for':True,'trend':trend,'strength':strength,'breadth':breadth,'confidence':confidence,
                  'scan_depth':'deep' if must_deep else 'shallow','evidence_scope':'direct_node' if evidence_ok else 'insufficient',
                  'evidence_basis':basis,'last_full_scan_date':BASELINE_DATE,'baseline_date':BASELINE_DATE,'daily_trigger':False,
                  'needs_profit_chain_research':must_deep,
                  'profit_chain_resolution':'unconfirmed_with_evidence_gap' if must_deep else 'not_required',
                  'metrics':{
                      'mapped_companies':n_total,'current_h1_reports':n_cur,'paired_h1_reports':n_pair,'report_coverage':round(coverage,4),
                      'revenue_yoy':None if rev_g is None else round(rev_g,4),'parent_netprofit_yoy':None if np_g is None else round(np_g,4),
                      'profit_improving_breadth':None if profit_breadth is None else round(profit_breadth,4),
                      'revenue_growth_breadth':None if revenue_breadth is None else round(revenue_breadth,4),
                      'gross_margin_median_delta_pct':None if gm_median_delta is None else round(gm_median_delta,4),
                      'current_parent_netprofit_sum':round(cur_np,2),'previous_parent_netprofit_sum':round(pre_np,2),
                  }
              }

          l3_rows=[classify_l3(n) for n in taxonomy['levels']['level3']]
          by_code_l3={r['code']:r for r in l3_rows}

          children=defaultdict(list)
          for r in l3_rows: children[r['parent_code']].append(r)

          def aggregate_node(node, level):
              # level2 aggregates direct level3 children; level1 aggregates all descendant level3 children.
              if level=='level2':
                  rows=children.get(node['code'],[])
              else:
                  l2codes={n['code'] for n in taxonomy['levels']['level2'] if n['parent_code']==node['code']}
                  rows=[r for r in l3_rows if r['parent_code'] in l2codes]
              n=len(rows)
              counts={k:sum(r['trend']==k for r in rows) for k in ('improving','stable','deteriorating','unconfirmed')}
              imp=counts['improving']; det=counts['deteriorating']; unc=counts['unconfirmed']
              confirmed=max(1,n-unc)
              if imp/confirmed >= 0.30 and imp > det: trend='improving'
              elif det/confirmed >= 0.30 and det > imp: trend='deteriorating'
              elif unc > n/2: trend='unconfirmed'
              else: trend='stable'
              strong_children=sum(r['strength']=='strong' and r['trend']==trend for r in rows)
              strength='strong' if strong_children>=max(1,math.ceil(0.25*confirmed)) else ('normal' if trend in {'improving','deteriorating'} else 'weak')
              if imp and det: breadth='divergent'
              elif trend=='improving' and imp/confirmed>=0.67: breadth='broad'
              elif trend=='deteriorating' and det/confirmed>=0.67: breadth='broad'
              elif trend in {'improving','deteriorating'}: breadth='selective'
              else: breadth='broad'
              high=sum(r['confidence']=='high' for r in rows); med=sum(r['confidence']=='medium' for r in rows)
              confidence='high' if high>=max(1,math.ceil(0.60*n)) else ('medium' if high+med>=max(1,math.ceil(0.60*n)) else 'low')
              must_deep=trend in {'improving','deteriorating'} or breadth in {'selective','divergent'}
              basis=(f"由{n}个三级子节点聚合：improving={imp}、stable={counts['stable']}、deteriorating={det}、unconfirmed={unc}；"
                     f"聚合仅用于上层审计，盈利链仍以三级节点真实证据为起点。")
              return {'code':node['code'],'name':node['name'],'level':level,'parent_code':node['parent_code'],'accounted_for':True,
                      'trend':trend,'strength':strength,'breadth':breadth,'confidence':confidence,'scan_depth':'deep' if must_deep else 'shallow',
                      'evidence_scope':'child_aggregate','evidence_basis':basis,'last_full_scan_date':BASELINE_DATE,'baseline_date':BASELINE_DATE,
                      'daily_trigger':False,'needs_profit_chain_research':must_deep,
                      'profit_chain_resolution':'unconfirmed_with_evidence_gap' if must_deep else 'not_required'}

          l2_rows=[aggregate_node(n,'level2') for n in taxonomy['levels']['level2']]
          l1_rows=[aggregate_node(n,'level1') for n in taxonomy['levels']['level1']]
          ledger={'level1':l1_rows,'level2':l2_rows,'level3':l3_rows}

          improving=[r for r in l3_rows if r['trend']=='improving']
          deteriorating=[r for r in l3_rows if r['trend']=='deteriorating']
          def score(r):
              m=r['metrics']; g=m.get('parent_netprofit_yoy')
              return ((g if g is not None else -9), m.get('profit_improving_breadth') or 0, m.get('report_coverage') or 0)
          improving_sorted=sorted(improving,key=score,reverse=True)
          deteriorating_sorted=sorted(deteriorating,key=lambda r:(r['metrics'].get('parent_netprofit_yoy') if r['metrics'].get('parent_netprofit_yoy') is not None else 9))

          deep_nodes=[r for level in ledger.values() for r in level if r['needs_profit_chain_research']]
          state={
              'manifest_schema':27,'pipeline':'a_share_low_risk_v2','mode':'shadow','generated_at':NOW.isoformat(),
              'run_type':'bootstrap_weekly_profitability_baseline','scan_mode':'weekly_full','weekly_baseline_date':BASELINE_DATE,
              'status':'profitability_baseline_complete','production_label':manifest['production_gate']['label'],
              'data_health':{
                  'passed':True,'evidence_provider':'Eastmoney RPT_LICO_FN_CPD public financial report dataset',
                  'mapped_mainboard_companies':len(mapped_codes),'current_h1_reports':len(current),'previous_h1_reports':len(previous),
                  'paired_h1_reports':len(pair_codes),'current_h1_coverage_pct':round(current_cov*100,2),'paired_h1_coverage_pct':round(pair_cov*100,2),
                  'company_index_status':index.get('status'),'company_index_mapped_to_level3_count':index.get('mapped_to_sw_level3_count')
              },
              'coverage_ledger':ledger,
              'market_profitability_radar':{
                  'method':'346个申万三级节点逐一按2026H1 vs 2025H1主板公司公开财务数据聚合筛查；不预选行业。',
                  'improving_count':len(improving),'deteriorating_count':len(deteriorating),
                  'stable_count':sum(r['trend']=='stable' for r in l3_rows),'unconfirmed_count':sum(r['trend']=='unconfirmed' for r in l3_rows),
                  'top_improving_level3':[{'code':r['code'],'name':r['name'],'trend':r['trend'],'strength':r['strength'],'breadth':r['breadth'],'confidence':r['confidence'],'metrics':r['metrics']} for r in improving_sorted[:40]],
                  'top_deteriorating_level3':[{'code':r['code'],'name':r['name'],'trend':r['trend'],'strength':r['strength'],'breadth':r['breadth'],'confidence':r['confidence'],'metrics':r['metrics']} for r in deteriorating_sorted[:25]],
              },
              'profit_chains':[], 'chain_comparisons':[], 'companies':{}, 'valuation_set':[], 'valuations':{}, 'price_structures':{},
              'opportunities':[], 'current_opportunity_best':[],
              'evidence_sources':{
                  'financial_dataset':'https://datacenter-web.eastmoney.com/api/data/v1/get reportName=RPT_LICO_FN_CPD',
                  'current_period':'2026-06-30','comparison_period':'2025-06-30','industry_mapping':'data/research/company_industry_index.json'
              },
              'diagnostics':{
                  'coverage':{
                      'taxonomy':'申万行业分类标准2021版','expected_counts':taxonomy['expected_counts'],'accounted_for_counts':taxonomy['expected_counts'],
                      'missing_level1':[],'missing_level2':[],'missing_level3':[],'profitability_discovery_gate_passed':True,
                      'unresolved_must_split_chains':[],'deep_nodes_total':len(deep_nodes),'deep_nodes_resolved':len(deep_nodes),
                      'completion_gate_passed':False,
                      'completion_note':'本次用户明确要求只完成346三级行业周度盈利全量基线；盈利链、公司比较、估值与价格结构留给后续完整18:00研究。'
                  },
                  'valuation':{'valuation_set_count':0,'executed_count':0,'complete_non_review_count':0,'review_required_count':0,'valuation_gate_passed':True}
              }
          }

          path=ROOT/'data/research/v2/research_state.json'
          path.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({
              'baseline_date':BASELINE_DATE,'level3':len(l3_rows),'improving':len(improving),'stable':sum(r['trend']=='stable' for r in l3_rows),
              'deteriorating':len(deteriorating),'unconfirmed':sum(r['trend']=='unconfirmed' for r in l3_rows),'deep_nodes_all_levels':len(deep_nodes),
              'current_h1_coverage_pct':round(current_cov*100,2),'pair_coverage_pct':round(pair_cov*100,2)
          },ensure_ascii=False))
          PY
      - name: Validate schema27 baseline contract
        run: pytest -q
      - name: Commit weekly profitability baseline
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/v2/research_state.json
          if git diff --cached --quiet; then
            echo 'No state change'
          else
            git commit -m 'research: persist schema27 weekly profitability baseline'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
